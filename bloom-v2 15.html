<style>
/* ── TOKENS ─────────────────────────────────── */
:root {
  --bg:    #0A1220;
  --bg2:   #0F1A2E;
  --bg3:   #152035;
  --gold:  #C8A85A;
  --gold2: #E2C97E;
  --gold3: rgba(200,168,90,0.15);
  --white: #F0EDE6;
  --muted: #7A7060;
  --muted2:#5A5248;
  --border:rgba(200,168,90,0.18);
  --border2:rgba(200,168,90,0.4);
  --green: #3DBF8A;
  --blue:  #4A9ECC;
  --red:   #CC4A4A;
  --orange:#CC8A3D;
  --r:14px; --rs:8px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --header-h:58px;
  --nav-h:60px;
  --serif:'Cormorant Garamond',serif;
  --sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--sans);color:var(--white);position:fixed;width:100%;height:100%;overflow:hidden;}

/* ── BACKGROUND ─────────────────────────────── */
.bg-layer{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 20% -10%,rgba(200,168,90,0.07) 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 90% 100%,rgba(200,168,90,0.04) 0%,transparent 60%),
             linear-gradient(160deg,#0A1220 0%,#0F1A2E 50%,#0A1220 100%);}

/* ── HEADER ─────────────────────────────────── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  height:calc(var(--header-h) + var(--safe-t));
  padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:16px;padding-right:16px;
  background:rgba(10,18,32,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.header-brand{display:flex;align-items:center;gap:10px;}
.header-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;
  border:1.5px solid var(--gold);box-shadow:0 0 14px rgba(200,168,90,0.25);}
.header-logo-fallback{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);
  background:var(--bg3);display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 0 14px rgba(200,168,90,0.25);}
.header-name{font-family:var(--serif);font-size:17px;color:var(--gold);letter-spacing:0.02em;line-height:1;}
.header-sub{font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:1px;}
.live-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;
  background:rgba(200,168,90,0.1);border:1px solid var(--border2);
  border-radius:999px;font-size:10px;font-weight:600;color:var(--gold);}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

/* ── SCROLL ──────────────────────────────────── */
.scroll{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;z-index:1;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);}
.screen{display:none;min-height:100%;}
.screen.active{display:block;}
.wrap{max-width:480px;margin:0 auto;padding:calc(var(--header-h) + var(--safe-t) + 12px) 14px 20px;}

/* ── NAV ─────────────────────────────────────── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(10,18,32,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;align-items:stretch;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;border:none;background:transparent;
  color:rgba(240,237,230,0.3);font-family:var(--sans);font-size:8.5px;font-weight:500;
  letter-spacing:0.04em;text-transform:uppercase;transition:color .2s;padding:0 2px;}
.nav-btn.active{color:var(--gold);}
.nav-icon{font-size:20px;line-height:1;}

/* ── CARDS ───────────────────────────────────── */
.card{background:rgba(15,26,46,0.85);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.card-sm{background:rgba(15,26,46,0.7);border:1px solid var(--border);
  border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;}
.card-gold{background:linear-gradient(135deg,rgba(200,168,90,0.08),rgba(15,26,46,0.9));
  border:1px solid var(--border2);}

/* ── SECTION HEADER ──────────────────────────── */
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;}
.sec-label{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--gold);
  letter-spacing:0.06em;text-transform:uppercase;}
.sec-count{font-size:10px;color:var(--muted);background:rgba(200,168,90,0.08);
  border:1px solid var(--border);border-radius:999px;padding:2px 8px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:16px 0;}

/* ── HERO ────────────────────────────────────── */
.hero{position:relative;margin:0 -14px;margin-top:calc(-1 * (var(--header-h) + var(--safe-t) + 12px));
  padding:calc(var(--header-h) + var(--safe-t) + 28px) 24px 28px;
  text-align:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(10,18,32,0) 0%,rgba(10,18,32,0.6) 50%,rgba(10,18,32,1) 100%);}
.hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 10%,rgba(200,168,90,0.12) 0%,transparent 70%);
  pointer-events:none;}
.hero-logo-wrap{position:relative;display:inline-block;margin-bottom:14px;}
.hero-logo{width:86px;height:86px;border-radius:50%;object-fit:cover;
  border:2px solid var(--gold);
  box-shadow:0 0 0 6px rgba(200,168,90,0.08),0 0 40px rgba(200,168,90,0.2);}
.hero-logo-fallback{width:86px;height:86px;border-radius:50%;
  border:2px solid var(--gold);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:42px;
  box-shadow:0 0 0 6px rgba(200,168,90,0.08),0 0 40px rgba(200,168,90,0.2);}
.hero-ring{position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(200,168,90,0.25);animation:ring 3.5s ease-in-out infinite;}
.hero-ring2{position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(200,168,90,0.1);animation:ring 3.5s ease-in-out infinite .6s;}
@keyframes ring{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.02)}}
.hero-title{font-family:var(--serif);font-size:26px;color:var(--gold);margin-bottom:6px;font-weight:600;}
.hero-tag{font-size:12px;color:rgba(240,237,230,0.6);font-style:italic;line-height:1.7;}

/* ── QUICK LINKS ──────────────────────────────── */
.ql-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.ql{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 6px;background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--r);text-decoration:none;cursor:pointer;transition:all .2s;}
.ql:hover,.ql:active{border-color:var(--gold);background:var(--gold3);}
.ql-icon{font-size:22px;}
.ql-label{font-size:9px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;}

/* ── INPUTS ──────────────────────────────────── */
input[type=text],input[type=password],input[type=number],input[type=url],input[type=email],textarea,select{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:var(--rs);padding:11px 13px;font-size:13px;color:var(--white);
  font-family:var(--sans);outline:none;transition:border-color .2s;
  margin-bottom:10px;-webkit-appearance:none;}
input:focus,textarea:focus,select:focus{border-color:var(--gold);background:rgba(200,168,90,0.05);}
textarea{resize:none;height:70px;}
select option{background:#152035;}
label.field-label{display:block;font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;margin-top:2px;}

/* ── BUTTONS ─────────────────────────────────── */
.btn{width:100%;padding:12px;border-radius:var(--rs);font-size:12px;font-weight:700;
  cursor:pointer;border:none;transition:all .2s;font-family:var(--sans);
  letter-spacing:.06em;text-transform:uppercase;}
.btn-gold{background:linear-gradient(135deg,#C8A85A,#E2C97E,#C8A85A);
  color:#0A1220;box-shadow:0 4px 18px rgba(200,168,90,0.25);}
.btn-gold:active{transform:scale(.98);}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--gold);border:1px solid var(--border2);}
.btn-sm{padding:5px 12px;border-radius:var(--rs);font-size:10px;font-weight:700;
  cursor:pointer;border:1px solid transparent;font-family:var(--sans);
  transition:all .2s;text-transform:uppercase;letter-spacing:.04em;}
.btn-approve{background:rgba(61,191,138,0.1);color:var(--green);border-color:rgba(61,191,138,0.3);}
.btn-reject{background:rgba(200,168,90,0.07);color:var(--muted);border-color:var(--border);}
.btn-danger{background:rgba(204,74,74,0.1);color:var(--red);border-color:rgba(204,74,74,0.3);}

/* ── BADGES ──────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
  border-radius:999px;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.badge-live{background:rgba(204,74,74,0.12);color:#FF7A7A;border:1px solid rgba(204,74,74,0.3);}
.badge-live::before{content:'';width:5px;height:5px;border-radius:50%;background:#FF7A7A;animation:pulse 1.5s infinite;}
.badge-offline{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid rgba(255,255,255,0.06);}
.tbadge-1{color:var(--gold);border:1px solid var(--border2);background:rgba(200,168,90,0.1);}
.tbadge-2{color:var(--blue);border:1px solid rgba(74,158,204,0.35);background:rgba(74,158,204,0.08);}
.tbadge-3{color:var(--orange);border:1px solid rgba(204,138,61,0.35);background:rgba(204,138,61,0.08);}
.tbadge-4{color:var(--green);border:1px solid rgba(61,191,138,0.3);background:rgba(61,191,138,0.07);}

/* ── AUTH ────────────────────────────────────── */
.auth-wrap{max-width:300px;margin:0 auto;text-align:center;padding:24px 14px;}
.auth-logo{width:72px;height:72px;border-radius:50%;object-fit:cover;
  border:2px solid var(--gold);margin-bottom:14px;box-shadow:0 0 28px rgba(200,168,90,0.2);}
.auth-logo-fallback{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);
  background:var(--bg3);display:flex;align-items:center;justify-content:center;
  font-size:34px;margin:0 auto 14px;box-shadow:0 0 28px rgba(200,168,90,0.2);}
.auth-title{font-family:var(--serif);font-size:22px;color:var(--gold);margin-bottom:5px;}
.auth-sub{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
.auth-err{font-size:11px;color:var(--red);min-height:16px;margin-top:4px;}

/* ── CREATOR CARD ────────────────────────────── */
.creator-card{display:flex;align-items:center;gap:11px;padding:11px 13px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--rs);margin-bottom:8px;cursor:pointer;transition:all .2s;}
.creator-card:active,.creator-card.sel{border-color:var(--gold);background:var(--gold3);}
.c-avatar{width:42px;height:42px;border-radius:50%;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;border:1.5px solid var(--border2);flex-shrink:0;}

/* ── TOGGLE ──────────────────────────────────── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--card-gold,rgba(200,168,90,0.05));
  border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;}
.switch{position:relative;width:48px;height:26px;cursor:pointer;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:rgba(255,255,255,0.08);
  border-radius:999px;transition:all .3s;border:1px solid var(--border);}
.slider::before{content:'';position:absolute;width:20px;height:20px;
  left:2px;top:2px;background:var(--muted);border-radius:50%;
  transition:all .3s;box-shadow:0 2px 6px rgba(0,0,0,0.4);}
.switch input:checked+.slider{background:rgba(200,168,90,0.18);border-color:var(--gold);}
.switch input:checked+.slider::before{transform:translateX(22px);background:var(--gold);}

/* ── STATS ───────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.stat-box{background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;text-align:center;}
.stat-num{font-family:var(--serif);font-size:24px;color:var(--gold);font-weight:600;line-height:1;}
.stat-lbl{font-size:9px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
.pbar{background:rgba(255,255,255,0.06);border-radius:999px;height:5px;overflow:hidden;margin-bottom:12px;}
.pbar-fill{background:linear-gradient(90deg,var(--gold),var(--gold2));height:100%;border-radius:999px;transition:width .6s;}

/* ── VIDEO ───────────────────────────────────── */
.vid-wrap{background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:all .2s;}
.vid-wrap:active{border-color:var(--gold);transform:translateY(-1px);}
.vid-thumb{width:100%;aspect-ratio:16/9;background:var(--bg3);position:relative;overflow:hidden;}
.vid-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.vid-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.2);}
.vid-play-btn{width:46px;height:46px;border-radius:50%;background:rgba(200,168,90,0.9);
  color:#0A1220;font-size:16px;display:flex;align-items:center;justify-content:center;
  padding-left:3px;box-shadow:0 2px 16px rgba(0,0,0,0.5);transition:transform .2s;}
.vid-wrap:active .vid-play-btn{transform:scale(1.1);}
.vid-info{padding:10px 13px 12px;}
.vid-num{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.vid-title{font-size:13px;font-weight:600;color:var(--white);}
.vid-desc{font-size:11px;color:var(--muted);margin-top:3px;}
.locked-box{background:rgba(255,255,255,0.02);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px;}
.locked-icon{font-size:28px;margin-bottom:8px;}
.locked-title{font-family:var(--serif);font-size:15px;color:var(--gold);margin-bottom:5px;}
.locked-sub{font-size:11px;color:var(--muted);line-height:1.65;}

/* ── ANNOUNCEMENTS ───────────────────────────── */
.ann-card{background:linear-gradient(135deg,rgba(200,168,90,0.07),rgba(15,26,46,0.9));
  border:1px solid var(--border2);border-left:3px solid var(--gold);
  border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.ann-label{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:7px;}
.ann-text{font-size:13px;color:var(--white);line-height:1.65;}
.ann-date{font-size:10px;color:var(--muted);margin-top:6px;}

/* ── DM MESSAGES ─────────────────────────────── */
.dm-card{padding:13px 15px;border-radius:var(--rs);margin-bottom:8px;}
.dm-from-agency{background:rgba(200,168,90,0.08);border:1px solid var(--border2);border-left:3px solid var(--gold);}
.dm-meta{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.dm-text{font-size:13px;color:var(--white);line-height:1.6;}
.dm-date{font-size:10px;color:var(--muted);margin-top:5px;}

/* ── Q CARDS ─────────────────────────────────── */
.q-card{background:rgba(255,255,255,0.02);border:1px solid var(--border);
  border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;}
.q-text{font-size:13px;color:var(--white);line-height:1.5;margin-bottom:7px;}
.q-meta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.upvote{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
  border-radius:999px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;
  font-family:var(--sans);transition:all .2s;}
.upvote:hover,.upvote.voted{border-color:var(--gold);color:var(--gold);background:var(--gold3);}

/* ── DEALS ───────────────────────────────────── */
.deal-card{background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--r);padding:15px;margin-bottom:10px;}
.deal-brand{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--white);margin-bottom:4px;}
.deal-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:9px;}
.deal-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.deal-tag{font-size:9px;padding:3px 8px;border-radius:999px;
  border:1px solid var(--border2);color:var(--gold);background:var(--gold3);}
.deal-pay{font-size:11px;font-weight:700;color:var(--green);margin-bottom:9px;}
.deal-applied{font-size:10px;color:var(--green);font-weight:700;padding:5px 11px;
  border-radius:var(--rs);background:rgba(61,191,138,0.08);
  border:1px solid rgba(61,191,138,0.2);display:inline-block;}

/* ── RUNSHEET ────────────────────────────────── */
.runsheet-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.runsheet-item:last-child{border-bottom:none;}
.rs-time{font-size:11px;font-weight:700;color:var(--gold);min-width:56px;}
.rs-task{font-size:12px;color:var(--white);line-height:1.5;}

/* ── MISSION ─────────────────────────────────── */
.mission-card{background:linear-gradient(135deg,rgba(61,191,138,0.06),rgba(15,26,46,0.9));
  border:1px solid rgba(61,191,138,0.25);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.mission-label{font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:8px;}
.mission-title{font-family:var(--serif);font-size:16px;color:var(--white);margin-bottom:5px;}
.mission-desc{font-size:12px;color:var(--muted);line-height:1.6;}
.mission-reward{font-size:11px;font-weight:700;color:var(--gold);margin-top:8px;}

.hype-card{background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;position:relative;}
.hype-msg{font-size:13px;color:var(--white);line-height:1.5;font-style:italic;}
.hype-from{font-size:10px;color:var(--gold);margin-top:5px;font-weight:600;}
.hype-heart{position:absolute;top:10px;right:12px;font-size:14px;}

/* ── ACADEMY PROGRESS ────────────────────────── */
.prog-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.prog-item:last-child{border-bottom:none;}
.prog-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.prog-check.done{background:rgba(61,191,138,0.15);border-color:rgba(61,191,138,0.4);color:var(--green);}
.prog-title{font-size:12px;color:var(--white);flex:1;}

/* ── SCHEDULE BOARD ──────────────────────────── */
.sched-card{display:flex;align-items:center;gap:12px;padding:11px 13px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--rs);margin-bottom:8px;}
.sched-day{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--gold);min-width:72px;}
.sched-name{font-size:13px;font-weight:600;color:var(--white);}
.sched-time{font-size:11px;color:var(--muted);}

/* ── INVITE BOX ──────────────────────────────── */
.invite-box{background:var(--gold3);border:1px solid var(--border2);border-radius:var(--rs);
  padding:12px 14px;font-size:15px;color:var(--gold);letter-spacing:.12em;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;}
.copy-btn{font-size:9px;color:var(--muted);cursor:pointer;padding:4px 9px;
  border-radius:var(--rs);border:1px solid var(--border);background:transparent;
  font-family:var(--sans);transition:all .2s;text-transform:uppercase;letter-spacing:.04em;}
.copy-btn:hover{color:var(--gold);}

/* ── TIER BTNS ───────────────────────────────── */
.tier-btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.tbtn{padding:4px 10px;border-radius:999px;font-size:9px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  font-family:var(--sans);transition:all .2s;text-transform:uppercase;}
.tbtn.t1{color:var(--gold);border-color:var(--border2);background:rgba(200,168,90,0.1);}
.tbtn.t2{color:var(--blue);border-color:rgba(74,158,204,0.35);background:rgba(74,158,204,0.08);}
.tbtn.t3{color:var(--orange);border-color:rgba(204,138,61,0.35);background:rgba(204,138,61,0.08);}
.tbtn.t4{color:var(--green);border-color:rgba(61,191,138,0.3);background:rgba(61,191,138,0.07);}

.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);left:50%;
  transform:translateX(-50%) translateY(70px);
  background:linear-gradient(135deg,var(--gold),var(--gold2));

  z-index:100;transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;pointer-events:none;box-shadow:0 4px 20px rgba(200,168,90,0.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{background:linear-gradient(135deg,#CC4A4A,#aa3333);color:#fff;}

.vmodal{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column;}
.vmodal.open{display:flex;}
.vmodal-hd{position:absolute;top:0;left:0;right:0;z-index:10;

.vembed{width:100%;flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;}
.vembed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}

.folder-name{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.07em;flex:1;}

.folder-hd.open .folder-chev{transform:rotate(90deg);}

.empty{text-align:center;padding:28px 14px;color:var(--muted);font-size:12px;}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.6;}

.tip-card{background:linear-gradient(135deg,rgba(74,158,204,0.05),rgba(15,26,46,0.9));

  const fb=document.getElementById('hlogo-fb');
  const src=localStorage.getItem('bc_logo')||LOGO_SRC;
  if(src){
    img.src=src;
    img.style.display='';
    if(fb)fb.style.display='none';
  } else {
    img.style.display='none';
    if(fb)fb.style.display='flex';
  }
}
function logoEl(cls){
  const src=localStorage.getItem('bc_logo')||LOGO_SRC;
  return `<img src="${src}" class="${cls}" alt="Bloom & Co"/>`;
}
function uploadLogo(){
  // iPad-compatible file input — must be in DOM for iOS Safari/Firefox
  let inp=document.getElementById('__logo_inp');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.id='__logo_inp';
    inp.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0;width:1px;height:1px;';
    document.body.appendChild(inp);
  }
  inp.value='';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>2*1024*1024){toast('Image too large — under 2MB please',true);return;}
    const r=new FileReader();
    r.onload=ev=>{localStorage.setItem('bc_logo',ev.target.result);applyLogo();toast('Logo updated ✓');go('mod');};
    r.readAsDataURL(f);
  };
  inp.click();
}
function removeLogo(){localStorage.removeItem('bc_logo');applyLogo();toast('Logo removed');go('mod');}

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'');
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
}

// ── NAV ───────────────────────────────────────────────────────
function go(tab){
  ['home','fan','creator','mod'].forEach(t=>{
    document.getElementById('s-'+t).classList.toggle('active',t===tab);
    document.getElementById('nb-'+t).classList.toggle('active',t===tab);
  });
  document.querySelector('.scroll').scrollTop=0;
  ({home:renderHome,fan:renderFan,creator:renderCreator,mod:renderMod})[tab]?.();
}

// ── VIDEO HELPERS ─────────────────────────────────────────────
function ytId(url){
  if(!url)return null;
  try{
    if(url.includes('youtu.be/')){const p=url.split('youtu.be/')[1];return p?p.split('?')[0].substring(0,11):null;}
    if(url.includes('youtube.com/watch')){return new URL(url).searchParams.get('v');}
    if(url.includes('youtube.com/embed/')){const p=url.split('embed/')[1];return p?p.split('?')[0].substring(0,11):null;}
  }catch(e){}return null;
}
function playVid(id,title){
  // EMBED ONLY - never opens YouTube externally
  if(!id){toast('Video unavailable — check the YouTube link',true);return;}
  document.getElementById('vmodal-title').textContent=title;
  // Use nocookie domain + playsinline to prevent iOS YouTube app prompt
  document.getElementById('vframe').src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1&modestbranding=1&controls=1&fs=0&iv_load_policy=3`;
  document.getElementById('vmodal').classList.add('open');
  document.body.style.overflow='hidden';
  document.querySelector('.scroll').style.overflow='hidden';
}
function closeVid(){
  document.getElementById('vmodal').classList.remove('open');
  document.getElementById('vframe').src='';
  document.body.style.overflow='';
  document.querySelector('.scroll').style.overflow='';
}
function markWatched(id){
  if(!watchedVideos.includes(id)){watchedVideos.push(id);localStorage.setItem('bc_watched',JSON.stringify(watchedVideos));}
}
// Compact card for horizontal rows

                  :`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;">🎬</div>`;
  const watched=watchedVideos.includes(v.id);
  const titleSafe=san(v.title).replace(/'/g,'&#39;').replace(/`/g,'&#96;');

// Folder emoji helper
function folderEmoji(name){
  const n=(name||'').toLowerCase();
  if(n.includes('live')||n.includes('stream'))return'🔴';
  if(n.includes('gift')||n.includes('diamond'))return'💎';
  if(n.includes('grow')||n.includes('audit'))return'📈';
  if(n.includes('brand')||n.includes('deal'))return'💼';
  if(n.includes('start')||n.includes('begin')||n.includes('intro'))return'🚀';
  if(n.includes('tiktok')||n.includes('platform'))return'📱';
  if(n.includes('content'))return'🎬';
  if(n.includes('money')||n.includes('income'))return'💰';
  return'📂';
}
let _folderState={};
function toggleFolder(key){
  _folderState[key]=!_folderState[key];
  const hd=document.getElementById('fhd-'+key);
  const body=document.getElementById('fbody-'+key);
  if(hd)hd.classList.toggle('open',_folderState[key]);
  if(body)body.classList.toggle('open',_folderState[key]);
}
// Render vids grouped by category as folder+row
function renderFolders(vids,showDel=false){
  if(!vids.length)return'<div class="empty"><div class="empty-icon">📂</div>Content coming soon</div>';
  // group by category
  const groups={};
  vids.forEach(v=>{const cat=v.category||v.folder||'General';if(!groups[cat])groups[cat]=[];groups[cat].push(v);});
  return Object.entries(groups).map(([cat,cvids])=>{
    const key=cat.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    if(_folderState[key]===undefined)_folderState[key]=true; // default open
    const isOpen=_folderState[key];
    return `<div class="folder-wrap">
      <div class="folder-hd ${isOpen?'open':''}" id="fhd-${key}" onclick="toggleFolder('${key}')">
        <span class="folder-icon">${folderEmoji(cat)}</span>
        <span class="folder-name">${san(cat)}</span>
        <span class="folder-count">${cvids.length}</span>
        <span class="folder-chev">›</span>
      </div>
      <div class="folder-body ${isOpen?'open':''}" id="fbody-${key}">
        <div class="vid-row">${cvids.map(v=>vidCardSm(v,showDel)).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

// ── FAN Q SUBMIT (from tab) ────────────────────────────────────
let _lastFanQ=0,_fanQCount=0;
async function submitFanQ_tab(){
  const now=Date.now();
  const errEl=document.getElementById('fanq-err');
  // Rate limiting
  if(now-_lastFanQ<10000){if(errEl)errEl.textContent='Please wait before sending another.';return;}
  if(_fanQCount>=5){if(errEl)errEl.textContent='Question limit reached for this session.';return;}
  // Honeypot
  const hp=document.getElementById('hp-fanq');
  if(hp&&hp.value.length>0){console.log('Bot detected');return;}
  const creatorId=document.getElementById('fan-creator-pick')?.value;
  const name=document.getElementById('fan-name')?.value.trim()||'@anonymous';
  const text=document.getElementById('fan-q')?.value.trim();
  if(!creatorId){if(errEl)errEl.textContent='Please select a creator.';return;}
  if(!text){if(errEl)errEl.textContent='Write your question first.';return;}
  if(text.length<3){if(errEl)errEl.textContent='Question is too short.';return;}
  if(text.split(' ').length<2){if(errEl)errEl.textContent='Please write a full question.';return;}
  // Block injection
  const blocked=['<script','javascript:','onerror=','eval(','<iframe','onload=','onclick='];
  if(blocked.some(b=>text.toLowerCase().includes(b)||name.toLowerCase().includes(b))){if(errEl)errEl.textContent='Invalid input.';return;}
  if(/(.){10,}/.test(text)){if(errEl)errEl.textContent='Invalid input.';return;}
  _lastFanQ=now;_fanQCount++;
  if(errEl)errEl.textContent='';
  try{
    await FS().addDoc(col('questions'),{creatorId,name:san(name),text:san(text),status:'pending',votes:0,createdAt:FS().serverTimestamp()});
    document.getElementById('fan-q').value='';
    document.getElementById('fan-name').value='';
    document.getElementById('fan-creator-pick').value='';
    if(errEl){errEl.style.color='var(--green)';errEl.textContent='Question sent! ✓ Your team will review it.';}
    setTimeout(()=>{if(errEl)errEl.textContent='';},4000);
  }catch(e){if(errEl)errEl.textContent='Connection error. Try again.';}
}

function dealsGate(){
  return `<div class="card">
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Approved creators only. Enter your brand deals code.</p>
    <input type="password" id="deal-pw" placeholder="Brand deals code" autocomplete="off" onkeydown="if(event.key==='Enter')unlockDeals()"/>
    <button class="btn btn-gold" onclick="unlockDeals()">Access Deals</button>
    <p class="auth-err" id="deal-err"></p>
    <p style="font-size:9px;color:var(--muted);margin-top:16px;cursor:pointer;" onclick="sessionStorage.removeItem('_dt');_dealTries=0;document.getElementById('deal-err').textContent='Reset — try again';document.getElementById('deal-pw').disabled=false;">Reset attempts</p>
  </div>`;
}
function renderDealsContent(){
  const allDeals=Object.values(deals);
  if(!allDeals.length)return'<div class="empty"><div class="empty-icon">💼</div>No deals posted yet</div>';
  return allDeals.map(d=>`<div class="deal-card">
    <div class="deal-brand">${san(d.brand)}</div>
    <div class="deal-desc">${san(d.description)}</div>
    <div class="deal-tags">${(d.niches||[]).map(n=>`<span class="deal-tag">${niche(n)}</span>`).join('')}${d.type?`<span class="deal-tag">${san(d.type)}</span>`:''}</div>
    <div class="deal-pay">💰 ${san(d.pay||'Pay discussed after application')}</div>
    ${appliedDeals.includes(d.id)?'<span class="deal-applied">✓ Applied — agency will be in touch</span>'
    :`<button class="btn btn-gold" onclick="applyDeal('${d.id}','${san(d.brand).replace(/'/g,'&#39;')}')">Apply for This Deal</button>`}
  </div>`).join('');
}

function unlockDeals(){
  const pw=document.getElementById('deal-pw')?.value?.trim();
  if(!pw)return;
  if(_dealTries>=5){document.getElementById('deal-err').textContent='Too many attempts.';return;}
  if(_cp(pw,'deal')){
    sessionStorage.removeItem('_dt');_dealTries=0;
    dealIn=true;renderCreator();
  }else{
    _incDeal();
    const left=5-_dealTries;
    document.getElementById('deal-err').textContent=left>0?`Incorrect — ${left} left.`:'Too many attempts.';
  }
}
async function applyDeal(id,brand){
  if(!creator)return;
  try{
    await FS().addDoc(col('dealApplications'),{dealId:id,brand:san(brand),creatorId:creator.id,creatorName:creator.name,niche:creator.niche,appliedAt:FS().serverTimestamp()});
    appliedDeals.push(id);localStorage.setItem('bc_applied',JSON.stringify(appliedDeals));
    toast('Applied! ✓');renderCreator();
  }catch(e){toast('Error',true);}
}

function showSchedForm(){

  document.getElementById('sched-form').innerHTML=`<div style="margin-top:10px;">
    <label class="field-label">Day</label>

async function postSched(){
  const day=document.getElementById('sc-day')?.value;
  const time=document.getElementById('sc-time')?.value.trim();
  if(!time){toast('Add your live time',true);return;}
  const dayOrder=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].indexOf(day);
  try{
    await FS().setDoc(ref('schedules',creator.id),{creatorId:creator.id,creatorName:creator.name,niche:creator.niche,day,time:san(time),topic:san(document.getElementById('sc-topic')?.value.trim()||''),dayOrder,live:creator.live,updatedAt:FS().serverTimestamp()});
    toast('Schedule saved ✓');renderCreator();
  }catch(e){toast('Error',true);}
}

async function toggleLive(){
  const isLive=document.getElementById('live-tog')?.checked;if(!creator)return;
  try{await FS().updateDoc(ref('creators',creator.id),{live:isLive});creator.live=isLive;
    const el=document.getElementById('live-status');if(el)el.textContent=isLive?'🔴 You are LIVE':'⚫ You are offline';
    toast(isLive?"You're live! 🔴":"You're offline");renderHome();
  }catch(e){toast('Error',true);}
}
async function updateStats(){
  const d=parseInt(document.getElementById('ms-d')?.value)||0;
  const h=parseFloat(document.getElementById('ms-h')?.value)||0;

  try{await FS().updateDoc(ref('creators',creator.id),{diamonds:d,hours:h});creator.diamonds=d;creator.hours=h;toast('Stats updated ✓');renderCreator();}
  catch(e){toast('Error',true);}
}
async function saveGoals(){
  const gd=parseInt(document.getElementById('ms-gd')?.value)||0;
  const gh=parseFloat(document.getElementById('ms-gh')?.value)||0;
  if(!creator)return;
  try{await FS().updateDoc(ref('creators',creator.id),{goalDiamonds:gd,goalHours:gh});creator.goalDiamonds=gd;creator.goalHours=gh;toast('Goals saved ✓');renderCreator();}
  catch(e){toast('Error',true);}

async function submitHype(){
  // Honeypot check
  const hph=document.getElementById('hp-hype');
  if(hph&&hph.value.length>0){console.log('Bot detected');return;}
  const from=document.getElementById('hype-from')?.value.trim()||'Anonymous';
  const msg=document.getElementById('hype-msg')?.value.trim();
  if(!msg){toast('Write a message first',true);return;}
  // Block injections
  const blocked=['\x3cscript','javascript:','onerror=','eval(','\x3ciframe','onload='];
  if(blocked.some(b=>msg.toLowerCase().includes(b)||from.toLowerCase().includes(b))){toast('Invalid input',true);return;}
  try{
    await FS().addDoc(col('hypeWall'),{creatorId:creator?.id||null,from:san(from),message:san(msg),status:'pending',createdAt:FS().serverTimestamp()});
    document.getElementById('hype-from').value='';document.getElementById('hype-msg').value='';
    toast('Sent for approval! ✓');
  }catch(e){toast('Error',true);}
}

async function creatorLogin(){
  const code=document.getElementById('c-code')?.value.trim().toUpperCase();
  if(!code){document.getElementById('c-err').textContent='Enter your code';return;}
  document.getElementById('c-err').textContent='Checking...';
  try{
    const inv=await FS().getDoc(ref('invites',code));
    if(inv.exists()&&!inv.data().used){showSetupForm(inv.data().niche,code);return;}
    const snap=await FS().getDocs(FS().query(col('creators'),FS().where('code','==',code)));
    if(!snap.empty){const d=snap.docs[0];creator={id:d.id,...d.data()};localStorage.setItem('bc_cc',code);subCreator();renderCreator();return;}
    document.getElementById('c-err').textContent='Code not found. Contact your agency.';

async function completeSetup(code){

function subCreator(){
  if(!creator)return;
  const q=FS().query(col('questions'),FS().where('creatorId','==',creator.id));
  FS().onSnapshot(q,snap=>{snap.docs.forEach(d=>questions[d.id]={id:d.id,...d.data()});if(document.getElementById('s-creator').classList.contains('active'))renderCreator();});
  FS().onSnapshot(FS().query(col('dms'),FS().where('creatorId','==',creator.id)),snap=>{snap.docs.forEach(d=>dms[d.id]={id:d.id,...d.data()});if(document.getElementById('s-creator').classList.contains('active'))renderCreator();});
  FS().onSnapshot(FS().query(col('dms'),FS().where('creatorId','==','all')),snap=>{snap.docs.forEach(d=>dms['all_'+d.id]={id:d.id,...d.data()});if(document.getElementById('s-creator').classList.contains('active'))renderCreator();});

function unlockMod(){
  const pw=document.getElementById('mod-pw')?.value?.trim();
  if(!pw)return;
  if(_modTries>=5){document.getElementById('mod-err').textContent='Too many attempts. Tap Reset below.';document.getElementById('mod-pw').disabled=true;return;}
  if(_cp(pw,'mod')){
    sessionStorage.removeItem('_mt');_modTries=0;
    modIn=true;subModData();renderMod();
  }else{
    _incMod();
    const left=5-_modTries;
    document.getElementById('mod-err').textContent=left>0?`Incorrect — ${left} left.`:'Too many attempts. Tap Reset below.';
  }
}

}
async function deleteMission(id){
  try{await FS().updateDoc(ref('missions',id),{deleted:true});delete missions[id];toast('Mission deleted');renderMod();}
  catch(e){toast('Error',true);}
}
let _rsItems=[];
function initRSItems(){_rsItems=[];renderRSItems();}
function addRSItem(){_rsItems.push({time:'',task:''});renderRSItems();}
function renderRSItems(){
  const wrap=document.getElementById('rs-items');if(!wrap)return;
  wrap.innerHTML=_rsItems.map((item,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px;">
    <input type="text" placeholder="Time" value="${san(item.time)}" oninput="_rsItems[${i}].time=this.value" style="width:80px;flex:0 0 80px;margin:0;font-size:11px;padding:7px 9px;"/>
    <input type="text" placeholder="Task / segment" value="${san(item.task)}" oninput="_rsItems[${i}].task=this.value" style="flex:1;margin:0;font-size:11px;padding:7px 9px;"/>
    <button onclick="_rsItems.splice(${i},1);renderRSItems()" style="width:28px;height:34px;border-radius:var(--rs);background:rgba(204,74,74,0.1);border:1px solid rgba(204,74,74,0.25);color:var(--red);cursor:pointer;flex-shrink:0;">✕</button>
  </div>`).join('');
}
async function saveRunsheet(){
  const cid=document.getElementById('rs-creator')?.value;if(!cid){toast('Select a creator',true);return;}
  const items=_rsItems.filter(i=>i.task.trim());
  try{await FS().setDoc(ref('runsheets',cid),{creatorId:cid,items:items.map(i=>({time:san(i.time),task:san(i.task)})),updatedAt:FS().serverTimestamp()});runsheets[cid]={creatorId:cid,items};toast('Run sheet saved ✓');}
  catch(e){toast('Error',true);}
}
let _addingVid=false;
async function addVideo(){
  if(_addingVid)return;
  const title=document.getElementById('v-title')?.value.trim();
  const url=document.getElementById('v-url')?.value.trim();
  const order=parseInt(document.getElementById('v-order')?.value)||999;
  if(!title||!url){toast('Add title and YouTube link',true);return;}
  const isYT=url.includes('youtube.com')||url.includes('youtu.be');
  if(!isYT){toast('Please use a YouTube link',true);return;}
  _addingVid=true;const btn=document.querySelector('[onclick="addVideo()"]');if(btn){btn.textContent='Adding...';btn.disabled=true;}
  try{
    const cat=document.getElementById('v-cat')?.value.trim()||'General';
    await FS().addDoc(col('hubVideos'),{title:san(title),url:san(url),description:san(document.getElementById('v-desc')?.value.trim()||''),category:san(cat),tier:document.getElementById('v-tier')?.value||'1',niche:document.getElementById('v-niche')?.value||'all',order,deleted:false,createdAt:FS().serverTimestamp()});
    document.getElementById('v-title').value='';document.getElementById('v-url').value='';document.getElementById('v-desc').value='';if(document.getElementById('v-cat'))document.getElementById('v-cat').value='';document.getElementById('v-order').value='';
    toast('Video added ✓');
  }catch(e){toast('Error',true);}
  finally{_addingVid=false;if(btn){btn.textContent='Add Video';btn.disabled=false;}}
}
async function deleteVid(id,title){
  if(!confirm(`Delete "${title}"?`))return;
  try{await FS().updateDoc(ref('hubVideos',id),{deleted:true});delete hubVideos[id];toast('Video deleted ✓');renderMod();}
  catch(e){toast('Error',true);}
}
async function postDeal(){
  const brand=document.getElementById('d-brand')?.value.trim();
  const desc=document.getElementById('d-desc')?.value.trim();
  if(!brand||!desc){toast('Add brand and description',true);return;}
  const niches=[];
  if(document.getElementById('d-pets')?.checked)niches.push('pets');
  if(document.getElementById('d-beauty')?.checked)niches.push('beauty');
  if(document.getElementById('d-lifestyle')?.checked)niches.push('lifestyle');
  try{await FS().addDoc(col('brandDeals'),{brand:san(brand),description:san(desc),pay:san(document.getElementById('d-pay')?.value.trim()||''),type:san(document.getElementById('d-type')?.value.trim()||''),niches,createdAt:FS().serverTimestamp()});document.getElementById('d-brand').value='';document.getElementById('d-desc').value='';toast('Deal posted ✓');}
  catch(e){toast('Error',true);}
}

// ══ SUBSCRIPTIONS ══════════════════════════════════════════════
function subModData(){
  FS().onSnapshot(col('questions'),snap=>{questions={};snap.docs.forEach(d=>questions[d.id]={id:d.id,...d.data()});if(modIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('dealApplications'),snap=>{window.__bc_apps={};snap.docs.forEach(d=>window.__bc_apps[d.id]={id:d.id,...d.data()});if(modIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('hypeWall'),snap=>{hypeWall={};snap.docs.forEach(d=>hypeWall[d.id]={id:d.id,...d.data()});if(modIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('missions'),snap=>{missions={};snap.docs.forEach(d=>missions[d.id]={id:d.id,...d.data()});if(modIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('runsheets'),snap=>{runsheets={};snap.docs.forEach(d=>runsheets[d.id]={id:d.id,...d.data()});});
}
function startSubs(){
  FS().onSnapshot(col('creators'),snap=>{creators={};snap.docs.forEach(d=>creators[d.id]={id:d.id,...d.data()});const n=Object.values(creators).filter(c=>c.live&&!c.deleted).length;document.getElementById('live-count').innerHTML=`<span class="pulse"></span><span>${n} Live</span>`;if(creator){const u=creators[creator.id];if(u)Object.assign(creator,u);}if(document.getElementById('s-home').classList.contains('active'))renderHome();if(modIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('questions'),snap=>{snap.docs.forEach(d=>{const ex=questions[d.id];questions[d.id]={id:d.id,...d.data(),myVote:ex?.myVote||false};});if(document.getElementById('s-fan').classList.contains('active'))renderFan();if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
  FS().onSnapshot(col('schedules'),snap=>{schedules={};snap.docs.forEach(d=>schedules[d.id]={id:d.id,...d.data()});if(document.getElementById('s-fan').classList.contains('active'))renderFan();if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
  FS().onSnapshot(col('brandDeals'),snap=>{deals={};snap.docs.forEach(d=>deals[d.id]={id:d.id,...d.data()});});
  FS().onSnapshot(col('announcements'),snap=>{announcements={};snap.docs.forEach(d=>announcements[d.id]={id:d.id,...d.data()});if(document.getElementById('s-home').classList.contains('active'))renderHome();if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
  FS().onSnapshot(col('hubVideos'),snap=>{hubVideos={};snap.docs.forEach(d=>{const v={id:d.id,...d.data()};if(!v.deleted)hubVideos[d.id]=v;});if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
  FS().onSnapshot(col('hypeWall'),snap=>{hypeWall={};snap.docs.forEach(d=>hypeWall[d.id]={id:d.id,...d.data()});if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
  FS().onSnapshot(col('missions'),snap=>{missions={};snap.docs.forEach(d=>missions[d.id]={id:d.id,...d.data()});if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
  FS().onSnapshot(col('runsheets'),snap=>{runsheets={};snap.docs.forEach(d=>runsheets[d.id]={id:d.id,...d.data()});if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
  FS().onSnapshot(col('dms'),snap=>{dms={};snap.docs.forEach(d=>dms[d.id]={id:d.id,...d.data()});if(document.getElementById('s-creator').classList.contains('active')&&creator)renderCreator();});
}

async function autoLogin(){
  const code=localStorage.getItem('bc_cc');if(!code)return;
  try{const snap=await FS().getDocs(FS().query(col('creators'),FS().where('code','==',code)));if(!snap.empty){const d=snap.docs[0];creator={id:d.id,...d.data()};subCreator();}}
  catch(e){}
}

// Boot
function boot(){
  applyLogo();
  startSubs();
  autoLogin().then(()=>renderHome());
}

document.getElementById('s-home').innerHTML=`<div style="padding:80px 40px;text-align:center;font-family:sans-serif;">
  <div style="font-size:40px;margin-bottom:16px;">🌸</div>
  <div style="color:#C8A85A;font-size:18px;font-family:serif;margin-bottom:8px;">Bloom & Co</div>
  <div style="color:#7A7060;font-size:12px;">Loading your hub...</div>
</div>`;
whenReady(boot);
