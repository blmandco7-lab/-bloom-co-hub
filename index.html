<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--ink:#0D1832;--ink2:#132040;--gold:#C9A94C;--gold2:#E8CF7A;--cream:#F5EFE0;
--muted:#7A7060;--muted2:rgba(245,239,224,.45);

}
html,body{height:100%;overflow:hidden;font-family:var(--fb)}
body{background:var(--ink);color:var(--cream);position:fixed;width:100%;height:100%}
input,textarea,select,button{font-family:var(--fb)}
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 20% 0%,rgba(201,169,76,.14),transparent 55%),radial-gradient(ellipse at 80% 100%,rgba(201,169,76,.08),transparent 50%),linear-gradient(160deg,#0D1832 0%,#0A1528 50%,#0D1F3C 100%)}
.bg::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(201,169,76,.09) 1px,transparent 0);
  background-size:32px 32px}
.scroll{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1;padding-bottom:calc(96px + var(--sb));}
.screen{display:none;min-height:100%}.screen.active{display:block}
.wrap{max-width:480px;margin:0 auto;padding:80px 15px 24px}
/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:40;padding:9px 15px;
  padding-top:calc(9px + var(--st));background:rgba(8,12,24,.95);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.hbrand{display:flex;align-items:center;gap:9px}
.hlogo{width:36px;height:36px;border-radius:50%;object-fit:contain;padding:2px;background:var(--ink2);border:2px solid var(--gold);box-shadow:0 0 12px rgba(201,169,76,.35)}
.hname{font-family:var(--fh);font-size:17px;color:var(--gold)}
.hsub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.lpill{display:flex;align-items:center;gap:5px;padding:4px 10px;

  border-radius:999px;font-size:11px;font-weight:600;color:var(--gold)}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;
  height:calc(60px + var(--sb));padding-bottom:var(--sb);
  background:rgba(8,12,24,.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:50px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;border:none;background:transparent;

  text-transform:uppercase;transition:color .2s;padding:5px 2px;position:relative}
.tab.on{color:var(--gold)}
.tab.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tic{font-size:19px;line-height:1}

.card{background:rgba(14,22,40,.75);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:11px;backdrop-filter:blur(12px)}
.cardg{background:linear-gradient(135deg,rgba(201,169,76,.08),rgba(14,22,40,.9));
  border:1px solid var(--border2);border-radius:var(--r);padding:16px;margin-bottom:11px}
.cards{background:rgba(14,22,40,.6);border:1px solid var(--border);

.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;margin-top:5px}
.sl{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.14em}
.cnt{background:rgba(201,169,76,.12);border:1px solid var(--border);border-radius:999px;

::placeholder{color:rgba(245,239,224,.28)}

.vemb{position:absolute;inset:0;background:#000}

.tc.bb4{background:rgba(232,84,84,.07);border-color:rgba(232,84,84,.25)}
.tc.bb5{background:rgba(155,112,207,.07);border-color:rgba(155,112,207,.25)}
.tb-bb1{color:#5BA4CF;border:1px solid rgba(91,164,207,.3);background:rgba(91,164,207,.08)}
.tb-bb2{color:#2ECC8A;border:1px solid rgba(46,204,138,.3);background:rgba(46,204,138,.08)}
.tb-bb3{color:#E5903A;border:1px solid rgba(229,144,58,.3);background:rgba(229,144,58,.08)}
.tb-bb4{color:#E85454;border:1px solid rgba(232,84,84,.3);background:rgba(232,84,84,.08)}
.tb-bb5{color:#9B70CF;border:1px solid rgba(155,112,207,.3);background:rgba(155,112,207,.08)}
.tcn{font-family:var(--fh);font-size:16px;font-weight:700}
.tcr{font-size:10px;color:var(--muted);margin-bottom:7px;font-style:italic}
.tcrw{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-top:1px solid rgba(245,239,224,.06)}
.tcd{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* onboarding */
.ck{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:7px;cursor:pointer;transition:all .2s}
.ck.done{background:rgba(46,204,138,.06);border-color:rgba(46,204,138,.25)}
.ckc{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s;margin-top:1px}
.ck.done .ckc{background:var(--green);border-color:var(--green);color:#fff}
.ckl{font-size:13px;font-weight:600;color:var(--cream);margin-bottom:2px}
.cks{font-size:11px;color:var(--muted);line-height:1.5}
.ck.done .ckl{color:var(--muted);text-decoration:line-through}
/* schedule slots */
.slot{background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:7px;display:flex;align-items:center;gap:11px}
.sloto{border-style:dashed;cursor:pointer}.sloto:hover,.sloto:active{border-color:var(--gold);background:rgba(201,169,76,.05)}
/* campaigns */
.cc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px}
.cctl{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--cream);margin-bottom:4px}
.ccen{font-size:11px;color:var(--green);font-weight:700;padding:6px 11px;border-radius:var(--rs);background:rgba(46,204,138,.1);border:1px solid rgba(46,204,138,.2);display:inline-block}
/* battles */
.bc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px;position:relative;overflow:hidden}
.bc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--orange),var(--gold))}
/* check-in */
.cinq{background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:9px}
.cinq label{font-size:12px;font-weight:600;color:var(--gold);display:block;margin-bottom:7px}
.cinq textarea{height:60px;margin-bottom:0}
.stars{display:flex;gap:7px}
.star{font-size:22px;cursor:pointer;opacity:.3;transition:opacity .2s;border:none;background:none;padding:3px}
.star.on{opacity:1}
/* scouting */
.scc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px}
.scttl{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:7px}
.scbody{font-size:12px;color:var(--cream);line-height:1.95;white-space:pre-wrap}
/* deals */
.dc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:11px}
/* mod */
.ibox{background:rgba(201,169,76,.08);border:1px solid var(--border2);border-radius:var(--rs);padding:13px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.1em}
.cpb{font-size:10px;color:var(--muted);cursor:pointer;padding:5px 9px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;transition:all .2s;text-transform:uppercase}
.cpb:hover{color:var(--gold)}
.tbs{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tbn{padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s;text-transform:uppercase}
.tbn.on{color:var(--gold);border-color:var(--border2);background:rgba(201,169,76,.12)}
.epick{font-size:21px;cursor:pointer;padding:5px;border-radius:var(--rs);border:2px solid transparent;transition:all .2s}
.epick.on{border-color:var(--gold);background:rgba(201,169,76,.1)}
/* auth */
.aw{max-width:300px;margin:0 auto;text-align:center;padding:22px 14px}
.alogo{width:74px;height:74px;border-radius:50%;object-fit:contain;background:var(--ink2);border:3px solid var(--gold);margin-bottom:16px;box-shadow:0 0 28px rgba(201,169,76,.3)}
.atl{font-family:var(--fh);font-size:24px;color:var(--gold);margin-bottom:7px}
.asu{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.65}
.aerr{font-size:12px;color:var(--red);margin-top:7px;min-height:17px}
/* about */
.abs{margin-bottom:18px}
.abs h3{font-family:var(--fh);font-size:19px;color:var(--gold);margin-bottom:9px;font-style:italic}
.abs p{font-size:13px;color:var(--muted2);line-height:1.8}
.abs ul{list-style:none;padding:0}
.abs ul li{font-size:13px;color:var(--muted2);line-height:1.8;padding-left:15px;position:relative}
.abs ul li::before{content:'✦';position:absolute;left:0;color:var(--gold);font-size:9px}
.joinc{background:linear-gradient(135deg,rgba(201,169,76,.12),rgba(14,22,40,.95));border:1px solid var(--border2);border-radius:20px;padding:22px;text-align:center;margin-bottom:18px}
.joinc h3{font-family:var(--fh);font-size:21px;color:var(--gold);margin-bottom:9px}
.joinc p{font-size:13px;color:var(--muted2);line-height:1.7;margin-bottom:16px}
/* misc */
.nbanner{background:linear-gradient(135deg,rgba(201,169,76,.1),rgba(14,22,40,.9));border:1px solid var(--border2);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:11px}
.nn{display:flex;align-items:center;gap:9px;padding:9px 13px;background:rgba(201,169,76,.07);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:13px}
.nn span{font-size:12px;color:var(--muted)}
.nn strong{color:var(--gold)}
.ticker-wrap{position:fixed;bottom:calc(60px + var(--sb));left:0;right:0;z-index:39;overflow:hidden;background:rgba(8,12,24,.97);border-top:1px solid rgba(201,169,76,.25);border-bottom:1px solid rgba(201,169,76,.15);padding:6px 0;}
.ticker-track{display:flex;gap:60px;white-space:nowrap;animation:ticker 60s linear infinite;}
.ticker-track:hover{animation-play-state:paused;}
.ticker-item{font-size:11px;color:var(--gold2);font-style:italic;flex-shrink:0;}
.ticker-item::before{content:'✦';margin-right:10px;color:var(--gold);font-style:normal;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.cow-card{background:linear-gradient(135deg,rgba(201,169,76,.12),rgba(14,22,40,.95));border:1px solid var(--border2);border-radius:var(--r);padding:16px;margin-bottom:13px;position:relative;overflow:hidden;}
.cow-card::before{content:'👑';position:absolute;right:14px;top:14px;font-size:28px;opacity:.3;}
.lb-row{display:flex;align-items:center;gap:11px;padding:11px 14px;background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:7px;}
.lb-rank{font-family:var(--fh);font-size:22px;font-weight:700;min-width:32px;text-align:center;}
.bat-result{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px;}
.res-winner{font-family:var(--fh);font-size:16px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.empty{text-align:center;padding:28px 13px;color:var(--muted);font-size:13px}
.eic{font-size:28px;margin-bottom:9px;opacity:.5}
/* toast */
.toast{position:fixed;bottom:calc(68px + var(--sb) + 9px);left:50%;
  transform:translateX(-50%) translateY(80px);
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);
  padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:300;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;
  pointer-events:none;box-shadow:0 4px 22px rgba(201,169,76,.35)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:linear-gradient(135deg,#E85454,#C03434);color:#fff}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>

    if(url.indexOf('youtu.be/')>-1)return url.split('youtu.be/')[1].split(/[?&]/)[0].substring(0,11);
    if(url.indexOf('youtube.com/watch')>-1)return new URL(url).searchParams.get('v')||'';
    if(url.indexOf('youtube.com/embed/')>-1)return url.split('youtube.com/embed/')[1].split(/[?&]/)[0].substring(0,11);
  }catch(e){}return'';
}
function driveId(url){
  if(!url)return'';
  try{
    // https://drive.google.com/file/d/FILE_ID/view
    if(url.indexOf('drive.google.com/file/d/')>-1){
      var parts=url.split('/file/d/')[1];
      return parts.split('/')[0];
    }
    // https://drive.google.com/open?id=FILE_ID
    if(url.indexOf('drive.google.com/open')>-1){
      return new URL(url).searchParams.get('id')||'';
    }
  }catch(e){}return'';
}

async function homeLogin(){
  var raw=document.getElementById('hlc')?document.getElementById('hlc').value:'';
  var code=raw.replace(/\s/g,'').replace(/[^A-Za-z0-9\-]/g,'').toUpperCase();
  var err=document.getElementById('hlerr');
  if(!code){if(err)err.textContent='Please enter your code first';return;}
  var btn=document.getElementById('hlbtn');
  if(btn){btn.textContent='Checking...';btn.disabled=true;}
  if(err)err.textContent='';
  try{
    var inv=await FS().getDoc(ref('invites',code));
    if(inv.exists()&&!inv.data().used){closeModal();showSetup(inv.data().niche,code);return;}
    var snap=await FS().getDocs(FS().query(col('creators'),FS().where('code','==',code)));
    if(!snap.empty){
      var d=snap.docs[0];CC={id:d.id,...d.data()};
      localStorage.setItem('bc_cc',code);
      subCQ();subVidProgress();closeModal();rHome();
      toast('Welcome back, '+CC.name+'! 🌸');
      return;
    }
    var allCreators=await FS().getDocs(col('creators'));
    var foundC=null;
    allCreators.docs.forEach(function(dd){
      var data=dd.data();
      if(data.code&&data.code.toUpperCase().replace(/\s/g,'')===code){foundC={id:dd.id,...data};}
    });
    if(foundC){
      CC=foundC;
      localStorage.setItem('bc_cc',foundC.code);
      subCQ();subVidProgress();closeModal();rHome();
      toast('Welcome back, '+CC.name+'! 🌸');
      return;
    }
    var allInvites=await FS().getDocs(FS().query(col('invites'),FS().where('used','==',false)));
    var foundInv=null;
    allInvites.docs.forEach(function(dd){
      if(dd.id.toUpperCase().replace(/\s/g,'')===code){foundInv={id:dd.id,...dd.data()};}
    });
    if(foundInv){closeModal();showSetup(foundInv.niche,foundInv.id);return;}

    if(err)err.textContent='Code not found. Check your code and try again. Contact your agency if the problem continues.';
    if(btn){btn.textContent='Log In';btn.disabled=false;}
  }catch(e){
    if(err)err.textContent='Connection error. Check your internet and try again.';
    if(btn){btn.textContent='Log In';btn.disabled=false;}
  }
}

async function addTip(){
  var text=document.getElementById('new-tip')?document.getElementById('new-tip').value.trim():'';
  if(!text){toast('Write a tip first',true);return;}
  try{await FS().addDoc(col('tips'),{text:san(text),active:true,createdAt:FS().serverTimestamp()});document.getElementById('new-tip').value='';toast('Tip added ✓');rMod();}catch(e){toast('Error',true);}
}
async function toggleTip(id,active){
  try{await FS().updateDoc(ref('tips',id),{active:active});toast(active?'Tip enabled ✓':'Tip hidden ✓');rMod();}catch(e){toast('Error',true);}
}
async function deleteTip(id){
  if(!confirm('Delete this tip?'))return;
  try{await FS().updateDoc(ref('tips',id),{deleted:true});delete window._tips[id];toast('Tip deleted ✓');rMod();}catch(e){toast('Error',true);}
}

async function setCOW(){
  var sel=document.getElementById('cow-creator')?document.getElementById('cow-creator').value:'';
  if(!sel){toast('Select a creator',true);return;}
  var cid=sel;
  var c=creators[cid];if(!c)return;
  var reason=document.getElementById('cow-reason')?document.getElementById('cow-reason').value.trim():'';
  try{
    await FS().setDoc(ref('siteSettings','cow'),{name:san(c.name),niche:c.niche,creatorId:cid,reason:san(reason||''),updatedAt:FS().serverTimestamp()});
    window._cow={name:c.name,niche:c.niche,reason:reason};
    toast('Creator of the Week set! ✓');rMod();rHome();
  }catch(e){toast('Error',true);}
}

async function setTier(cid,tier){

  var bizTiers=['business','subagency'];

    if(bizTiers.indexOf(tier)>-1){
      // Business/sub-agency: add to tiers array without changing main tier
      var currentTiers=c.tiers||[];
      var idx=currentTiers.indexOf(tier);
      if(idx>-1){
        currentTiers.splice(idx,1);

      if(CC&&CC.id===cid)CC.tier=tier;
      toast('Updated to '+tr(tier).lbl+' ✓');

    rMod();

function downloadBattleTemplate(){
  var err=document.getElementById('bat-csv-err');if(err)err.textContent='';
  var rows=[
    ['Date','Time (EST)','Follower Bracket','Diamond Count','Power-Ups','Format','Creator/Handle','Status','Notes'],
    ['','','','','','','','',''],
    ['','','','','','','','',''],
    ['','','','','','','','',''],
    ['','','','','','','','',''],
    ['','','','','','','','','']
  ];
  var csv=rows.map(function(row){
    return row.map(function(cell){
      if(cell.indexOf(',')>-1||cell.indexOf('"')>-1){
        return '"'+cell.replace(/"/g,'""')+'"';
      }
      return cell;
    }).join(',');
  }).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='bloom_co_battle_template.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},100);
}
function parseCSVLine(line){
  var result=[];var cur='';var inQuotes=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQuotes=!inQuotes;}
    else if(ch===','&&!inQuotes){result.push(cur);cur='';}
    else{cur+=ch;}
  }
  result.push(cur);
  return result.map(function(s){return s.trim();});
}

// Parse dates flexibly - handles "6/20", "June 20, 2026", "2026-06-20", etc.
function parseFlexDate(str){
  if(!str)return null;
  var s=String(str).trim();
  // YYYY-MM-DD - parse as LOCAL date, not UTC (avoids timezone day-shift bugs)
  var iso=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(iso){
    var y=parseInt(iso[1],10),mo=parseInt(iso[2],10)-1,da=parseInt(iso[3],10);
    return new Date(y,mo,da);
  }
  // M/D format - assume current year
  var m=s.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){
    var now=new Date();
    var year=now.getFullYear();
    var month=parseInt(m[1],10)-1;
    var day=parseInt(m[2],10);
    return new Date(year,month,day);
  }
  // Fallback: let the browser try (e.g. "June 20, 2026")
  var d=new Date(s);
  if(!isNaN(d.getTime()))return d;
  return null;
}

function openBattleDay(key){

  var dateObj=new Date(y,mo-1,da);

  var dayBattles=Object.values(battles).filter(function(b){
    var d=parseFlexDate(b.date);
    if(!d)return false;

  });

      m+='<div style="font-size:11px;color:var(--muted);">'+san(b.type||'Battle')+'</div>';
      if(modOn){
        m+='<button class="bsm bdel" style="margin-top:8px;" onclick="deleteBattleFromModal(\''+b.id+'\',\''+key+'\')">\ud83d\uddd1 Remove This Battle</button>';
      }
      m+='</div>';
    });
    if(modOn){
      m+='<button class="btn btngh" onclick="openAddBattleForm(\''+key+'\')" style="margin-top:8px;">+ Add Another Battle on This Day</button>';
    }
  }else{

async function createBattlesFromRows(rows,err,fileInput){
  if(rows.length<2){if(err)err.textContent='No data rows found in the file';return;}
  var header=rows[0].map(function(h){return String(h||'').toLowerCase().trim();});
  // Battle slot spreadsheet format
  var dateIdx=header.indexOf('date');
  var timeIdx=header.findIndex(function(h){return h.indexOf('time')>-1;});
  var bracketIdx=header.findIndex(function(h){return h.indexOf('bracket')>-1||h.indexOf('follower')>-1;});
  var puIdx=header.findIndex(function(h){return h.indexOf('power')>-1||h==='pu'||h.indexOf('power-up')>-1;});
  var diamondIdx=header.findIndex(function(h){return h.indexOf('diamond')>-1;});
  var formatIdx=header.indexOf('format');
  var handleIdx=header.findIndex(function(h){return h.indexOf('creator')>-1||h.indexOf('handle')>-1;});
  var statusIdx=header.indexOf('status');
  var notesIdx=header.indexOf('notes');
  // Fallback: generic Title/Description format
  var tIdx=header.indexOf('title');
  var typeIdx=header.indexOf('type');
  var descIdx=header.indexOf('description');
  var prizeIdx=header.indexOf('prize');

  var useSlotFormat=(dateIdx>-1&&handleIdx>-1&&formatIdx>-1);
  if(!useSlotFormat&&(tIdx===-1||descIdx===-1)){
    if(err)err.textContent='File must have either (Title + Description) columns or (Date + Creator/Handle + Format) columns';
    return;
  }

  // Build a set of existing battle signatures to avoid duplicates on re-upload
  var existing={};
  Object.values(battles).forEach(function(b){
    if(!b.deleted)existing[(b.title||'')+'|'+(b.date||'')]=true;
  });

  var created=0,skipped=0;
  for(var i=1;i<rows.length;i++){
    var row=rows[i];
    if(useSlotFormat){
      var handle=handleIdx>-1&&row[handleIdx]?String(row[handleIdx]).trim():'';
      var format=formatIdx>-1&&row[formatIdx]?String(row[formatIdx]).trim():'';
      if(!handle&&!format)continue;
      var dateVal=dateIdx>-1&&row[dateIdx]?String(row[dateIdx]).trim():'';
      var timeVal=timeIdx>-1&&row[timeIdx]?String(row[timeIdx]).trim():'';
      var bracketVal=bracketIdx>-1&&row[bracketIdx]?String(row[bracketIdx]).trim():'';
      var puVal=puIdx>-1&&row[puIdx]?String(row[puIdx]).trim():'';
      var diamondVal=diamondIdx>-1&&row[diamondIdx]?String(row[diamondIdx]).trim():'';
      var statusVal=statusIdx>-1&&row[statusIdx]?String(row[statusIdx]).trim():'';
      var notesVal=notesIdx>-1&&row[notesIdx]?String(row[notesIdx]).trim():'';

      var title=(handle?handle+' — ':'')+(format||'Battle Slot');
      var descParts=[];
      if(timeVal)descParts.push('Time: '+timeVal+' EST');
      if(bracketVal)descParts.push('Follower bracket: '+bracketVal);
      if(diamondVal)descParts.push('Diamond count: '+diamondVal);
      if(puVal)descParts.push('Power-Ups: '+puVal);
      if(notesVal)descParts.push(notesVal);
      var description=descParts.join(' · ');
      var battleStatus=statusVal&&statusVal.toLowerCase()==='filled'?'filled':'open';

      var sig=san(title)+'|'+san(dateVal);
      if(existing[sig]){skipped++;continue;}
      existing[sig]=true;

      await FS().addDoc(col('battles'),{
        title:san(title),
        type:san(format||'Battle Slot'),
        date:san(dateVal),
        description:san(description),
        prize:'',
        diamondCount:san(diamondVal),
        slotStatus:battleStatus,
        createdAt:FS().serverTimestamp()
      });
      created++;
    }else{
      var title2=row[tIdx]?String(row[tIdx]).trim():'';
      if(!title2)continue;
      var dateVal2=dateIdx>-1&&row[dateIdx]?String(row[dateIdx]).trim():'';
      var sig2=san(title2)+'|'+san(dateVal2);
      if(existing[sig2]){skipped++;continue;}
      existing[sig2]=true;
      await FS().addDoc(col('battles'),{
        title:san(title2),
        type:san(typeIdx>-1&&row[typeIdx]?String(row[typeIdx]).trim():'Diamond Battle'),
        date:san(dateVal2),
        description:san(descIdx>-1&&row[descIdx]?String(row[descIdx]).trim():''),
        prize:san(prizeIdx>-1&&row[prizeIdx]?String(row[prizeIdx]).trim():''),
        createdAt:FS().serverTimestamp()
      });
      created++;
    }
  }
  if(err)err.textContent='';
  var msg=created+' battle(s) created';
  if(skipped)msg+=', '+skipped+' skipped (already added)';
  toast(msg+' ✓');
  if(fileInput)fileInput.value='';
  rMod();
}
async function uploadBattleCSV(){
  var fileInput=document.getElementById('bat-csv');
  var err=document.getElementById('bat-csv-err');
  if(!fileInput||!fileInput.files||!fileInput.files[0]){if(err)err.textContent='Choose a file first';return;}
  var file=fileInput.files[0];
  var name=(file.name||'').toLowerCase();
  var isExcel=name.endsWith('.xlsx')||name.endsWith('.xls');
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var rows;
      if(isExcel){
        if(typeof XLSX==='undefined'){if(err)err.textContent='Excel support failed to load. Try saving as CSV instead.';return;}
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array'});
        var sheet=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
      }else{
        var text=e.target.result;
        var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
        rows=lines.map(parseCSVLine);
      }
      await createBattlesFromRows(rows,err,fileInput);
    }catch(e2){if(err)err.textContent='Error reading file. Check the format and try again.';}
  };
  if(isExcel){reader.readAsArrayBuffer(file);}else{reader.readAsText(file);}
}

function runBots(){
  if(!modOn)return;
  var now=new Date();
  var allC3=Object.values(creators).filter(function(c){return!c.deleted;});
  var promises=[];
  allC3.forEach(function(c){
    // WELCOME BOT

      var created=new Date(c.createdAt.seconds*1000);

      }
    }
    // CHECKIN REMINDER — Sundays
    if(now.getDay()===0){
      var myCI=Object.values(checkins).filter(function(ci){
        if(ci.creatorId!==c.id)return false;
        return ci.submittedAt&&(now-new Date(ci.submittedAt.seconds*1000))<7*24*3600000;
      });
      if(!myCI.length&&c.checkinReminderDate!==now.toDateString()){
        promises.push(sendBotMsg(c.id,'reminder','Reminder '+san(c.name)+'! Submit your Weekly Check-In in the Hub before midnight tonight. Go to Hub then Check-In. Your stats must be logged to qualify for your incentive tier this week! 🌸').then(function(){return FS().updateDoc(ref('creators',c.id),{checkinReminderDate:now.toDateString()});}));
      }
    }
    // SCHEDULE REMINDER — day before live
    var mySch2=schedules[c.id];
    if(mySch2&&mySch2.days){
      var tmrw=new Date(now);tmrw.setDate(tmrw.getDate()+1);
      var tmrwDay=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][tmrw.getDay()];
      if(mySch2.days.indexOf(tmrwDay)>-1&&c.schedReminderDate!==now.toDateString()){
        var ttime=mySch2.times&&mySch2.times[tmrwDay]?' at '+mySch2.times[tmrwDay]:'';
        promises.push(sendBotMsg(c.id,'schedule','Reminder '+san(c.name)+'! You have a live scheduled tomorrow ('+tmrwDay+ttime+'). Check your TikTok Campaigns tab, set up your gift gallery, and post a teaser video before you go live! 🎬').then(function(){return FS().updateDoc(ref('creators',c.id),{schedReminderDate:now.toDateString()});}));
      }
    }
    // MILESTONE BOT — tier upgrade
    if(c.tier&&c.prevTier&&c.tier!==c.prevTier){
      var to=['seedling','grower','bloomer','bloom','elite'];
      if(to.indexOf(c.tier)>to.indexOf(c.prevTier)){
        promises.push(sendBotMsg(c.id,'milestone','Congratulations '+san(c.name)+'! You have been upgraded to '+tr(c.tier).lbl+'! Your hard work is paying off. Keep going! 🌸👑').then(function(){return FS().updateDoc(ref('creators',c.id),{prevTier:c.tier});}));
      }
    }
    // BATTLE REMINDER
    Object.values(battles).forEach(function(b){
      if(b.date&&b.date.toLowerCase().includes('tomorrow')){
        promises.push(sendBotMsg(c.id,'battle','Battle reminder! '+san(b.title)+' is tomorrow. Get ready — battle on! ⚔️'));
      }
    });
    // CAMPAIGN DEADLINE REMINDER
    Object.values(campaigns).forEach(function(camp){
      if(camp.deadline){
        try{
          var dl=new Date(camp.deadline);
          var daysLeft=Math.round((dl-now)/86400000);
          if(daysLeft===2){
            promises.push(sendBotMsg(c.id,'campaign','Campaign deadline in 2 days! '+san(camp.title)+' — make sure you complete this before the deadline. Campaigns are required! 🚀'));
          }
        }catch(e){}
      }
    });
  });
  Promise.all(promises).then(function(){toast('Bots ran for '+allC3.length+' creators ✓');}).catch(function(){toast('Bots ran with some errors',true);});
}

      var needsR=!lastUp||(now-lastUp)>(6*24*60*60*1000);
      var rKey='sr_'+c.id+'_'+now.toISOString().split('T')[0];
      if(needsR&&!_botsSent[rKey]){
        _botsSent[rKey]=true;
        try{await FS().addDoc(col('botNotifications'),{type:'stats-reminder',creatorId:c.id,creatorName:c.name,message:'Hey '+c.name+'! Reminder to log your diamonds and hours in the Hub before midnight tonight. Go to My Stats and enter this weeks numbers to qualify for your incentive rewards. \uD83C\uDF38',sentAt:FS().serverTimestamp(),read:false});}catch(e){}
      }
    }
    // MILESTONE BOT
    if(c.tier&&c.lastBotTier&&c.tier!==c.lastBotTier){
      var tNames={seedling:'Seedling',grower:'Grower',bloomer:'Bloomer',bloom:'Bloom',elite:'Elite'};
      if(tNames[c.tier]){
        try{
          await FS().addDoc(col('botNotifications'),{type:'milestone',creatorId:c.id,creatorName:c.name,message:'Congratulations '+c.name+'! You have been upgraded to '+tNames[c.tier]+' tier! Your new training content is now unlocked in the Hub. Keep pushing! \uD83C\uDF38\uD83D\uDC51',sentAt:FS().serverTimestamp(),read:false});
          await FS().updateDoc(ref('creators',c.id),{lastBotTier:c.tier});
        }catch(e){}
      }
    }
    if(c.tier&&!c.lastBotTier){try{await FS().updateDoc(ref('creators',c.id),{lastBotTier:c.tier});}catch(e){}}
    // SCHEDULE REMINDER BOT
    var mySch=schedules[c.id];
    if(mySch&&mySch.days){
      var tom=new Date(now);tom.setDate(tom.getDate()+1);
      var tomDay=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][tom.getDay()];
      if(mySch.days.indexOf(tomDay)>-1){
        var sKey='sch_'+c.id+'_'+tom.toISOString().split('T')[0];
        if(!_botsSent[sKey]){
          _botsSent[sKey]=true;
          var sTime=mySch.times?mySch.times[tomDay]:mySch.time||'';
          try{await FS().addDoc(col('botNotifications'),{type:'schedule-reminder',creatorId:c.id,creatorName:c.name,message:'Hey '+c.name+'! You are scheduled to go live tomorrow '+tomDay+(sTime?' at '+sTime:'')+'. Post a teaser video at least 1 hour before and check your TikTok Campaigns tab! \uD83C\uDF3F',sentAt:FS().serverTimestamp(),read:false});}catch(e){}
        }
      }
    }
  }
  // BATTLE REMINDER - for all enrolled
  Object.values(battles).forEach(function(b){
    allC.forEach(async function(c){
      var bKey='bat_'+c.id+'_'+b.id;
      if(!_botsSent[bKey]){
        _botsSent[bKey]=true;
        if(b.date){
          try{await FS().addDoc(col('botNotifications'),{type:'battle-reminder',creatorId:c.id,creatorName:c.name,message:'Battle reminder! '+san(b.title)+' is coming up on '+san(b.date)+'. Make sure you are ready! \u2694\uFE0F\uD83D\uDD25',sentAt:FS().serverTimestamp(),read:false});}catch(e){}
        }
      }
    });
  });
  // CAMPAIGN REMINDER
  Object.values(campaigns).forEach(function(camp){
    allC.forEach(async function(c){
      var cKey='camp_'+c.id+'_'+camp.id;
      if(!_botsSent[cKey]){
        _botsSent[cKey]=true;
        try{await FS().addDoc(col('botNotifications'),{type:'campaign-reminder',creatorId:c.id,creatorName:c.name,message:'Campaign available: '+san(camp.title)+'! Campaigns are required. Sign up through your TikTok Campaigns tab and report back. '+(camp.reward?'Reward: '+san(camp.reward)+'. ':'')+'Do not miss out! \uD83D\uDE80',sentAt:FS().serverTimestamp(),read:false});}catch(e){}
      }
    });
  });
}

}

async function seedDefaultTips(){

  try{

    for(var i=0;i<TIPS.length;i++){
      await FS().addDoc(col('tips'),{text:TIPS[i],active:true,isDefault:true,order:i,createdAt:FS().serverTimestamp()});
    }
    console.log('Seeded '+TIPS.length+' default tips');
  }catch(e){console.log('Tips seed error',e);}
}
