<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--ink:#0D1832;--ink2:#132040;--gold:#C9A94C;--gold2:#E8CF7A;--cream:#F5EFE0;
--muted:#7A7060;--muted2:rgba(245,239,224,.45);
--border:rgba(201,169,76,.18);--border2:rgba(201,169,76,.4);
--green:#2ECC8A;--red:#E85454;--blue:#5BA4CF;--orange:#E5903A;--purple:#9B70CF;
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
--r:14px;--rs:10px;--fh:'Cormorant Garamond',Georgia,serif;--fb:'DM Sans',sans-serif
}
html,body{height:100%;overflow:hidden;font-family:var(--fb)}
body{background:var(--ink);color:var(--cream);position:fixed;width:100%;height:100%}
input,textarea,select,button{font-family:var(--fb)}
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 20% 0%,rgba(201,169,76,.14),transparent 55%),radial-gradient(ellipse at 80% 100%,rgba(201,169,76,.08),transparent 50%),linear-gradient(160deg,#0D1832 0%,#0A1528 50%,#0D1F3C 100%)}
.bg::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(201,169,76,.09) 1px,transparent 0);
  background-size:32px 32px}
.scroll{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1;padding-bottom:calc(62px + var(--sb))}
.screen{display:none;min-height:100%}.screen.active{display:block}
.wrap{max-width:480px;margin:0 auto;padding:72px 15px 24px}
/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:40;padding:9px 15px;
  padding-top:calc(9px + var(--st));background:rgba(8,12,24,.95);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.hbrand{display:flex;align-items:center;gap:9px}
.hlogo{width:36px;height:36px;border-radius:50%;object-fit:contain;padding:2px;background:var(--ink2);border:2px solid var(--gold);box-shadow:0 0 12px rgba(201,169,76,.35)}
.hname{font-family:var(--fh);font-size:17px;color:var(--gold)}
.hsub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.lpill{display:flex;align-items:center;gap:5px;padding:4px 10px;
  background:rgba(201,169,76,.1);border:1px solid var(--border2);
  border-radius:999px;font-size:11px;font-weight:600;color:var(--gold)}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;
  height:calc(60px + var(--sb));padding-bottom:var(--sb);
  background:rgba(8,12,24,.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:50px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;border:none;background:transparent;
  color:rgba(245,239,224,.28);font-size:8px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;transition:color .2s;padding:5px 2px;position:relative}
.tab.on{color:var(--gold)}
.tab.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tic{font-size:19px;line-height:1}
/* cards */
.card{background:rgba(14,22,40,.75);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:11px;backdrop-filter:blur(12px)}
.cardg{background:linear-gradient(135deg,rgba(201,169,76,.08),rgba(14,22,40,.9));
  border:1px solid var(--border2);border-radius:var(--r);padding:16px;margin-bottom:11px}
.cards{background:rgba(14,22,40,.6);border:1px solid var(--border);
  border-radius:var(--rs);padding:11px 14px;margin-bottom:7px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;margin-top:5px}
.sl{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.14em}
.cnt{background:rgba(201,169,76,.12);border:1px solid var(--border);border-radius:999px;
  padding:2px 9px;font-size:10px;color:var(--muted);font-weight:600}
.div{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:18px 0}
/* inputs */
input[type=text],input[type=password],input[type=number],input[type=url],textarea,select{
  width:100%;background:rgba(245,239,224,.05);border:1px solid rgba(245,239,224,.12);
  border-radius:var(--rs);padding:12px 14px;font-size:14px;color:var(--cream);
  outline:none;transition:all .2s;margin-bottom:9px;-webkit-appearance:none}
input[type=password]{letter-spacing:.1em}
input:focus,textarea:focus,select:focus{border-color:var(--gold);background:rgba(201,169,76,.06)}
textarea{resize:none;height:72px}
select option{background:#132040}
::placeholder{color:rgba(245,239,224,.28)}
/* buttons */
.btn{width:100%;padding:13px;border-radius:var(--rs);font-size:12px;font-weight:600;
  cursor:pointer;border:none;transition:all .2s;letter-spacing:.06em;text-transform:uppercase}
.btng{background:linear-gradient(135deg,#B89040,#E8CF7A,#C9A94C);color:var(--ink);
  box-shadow:0 4px 20px rgba(201,169,76,.35)}
.btng:active{transform:scale(.98)}
.btngh{background:rgba(245,239,224,.06);color:var(--gold);border:1px solid var(--border2)}
.bsm{padding:6px 11px;border-radius:var(--rs);font-size:10px;font-weight:700;

.bok{background:rgba(46,204,138,.1);color:var(--green);border-color:rgba(46,204,138,.3)}

.bdel{background:rgba(232,84,84,.1);color:var(--red);border-color:rgba(232,84,84,.3)}

.r1{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(201,169,76,.45);animation:rw 3.5s ease-in-out infinite}
.r2{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(201,169,76,.2);animation:rw 3.5s ease-in-out infinite .6s}
@keyframes rw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.5}}
.htl{font-family:var(--fh);font-size:30px;font-weight:700;color:var(--gold);line-height:1.1;margin-bottom:7px}
.hsu{font-size:13px;color:var(--muted2);line-height:1.7;font-style:italic}
/* home grid */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.hc{background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 8px;text-align:center;cursor:pointer;text-decoration:none;display:block;transition:all .2s}
.hc:hover,.hc:active{border-color:var(--gold);background:rgba(201,169,76,.07)}
.hci{font-size:24px;margin-bottom:6px}
.hcl{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.hcs{font-size:10px;color:var(--muted);margin-top:2px}
/* announcements */
.ann{background:linear-gradient(135deg,rgba(201,169,76,.07),rgba(14,22,40,.9));

  border-radius:var(--r);padding:14px;margin-bottom:9px}
/* tip */
.tip{background:linear-gradient(135deg,rgba(91,164,207,.06),rgba(14,22,40,.8));
  border:1px solid rgba(91,164,207,.18);border-radius:var(--r);padding:14px;margin-bottom:13px}
/* creator row */
.crow{display:flex;align-items:center;gap:11px;padding:12px 14px;

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;

.blive::before{content:'';width:5px;height:5px;border-radius:50%;background:#FF7575;animation:pulse 1.5s infinite}
.boff{background:rgba(245,239,224,.04);color:var(--muted);border:1px solid rgba(245,239,224,.08)}

.tb-s{color:#5A9A5A;border:1px solid rgba(90,154,90,.3);background:rgba(90,154,90,.1)}
.tb-gr{color:var(--blue);border:1px solid rgba(91,164,207,.3);background:rgba(91,164,207,.08)}
.tb-bl{color:var(--green);border:1px solid rgba(46,204,138,.3);background:rgba(46,204,138,.08)}
.tb-bm{color:var(--orange);border:1px solid rgba(229,144,58,.3);background:rgba(229,144,58,.08)}
.tb-e{color:var(--purple);border:1px solid rgba(155,112,207,.3);background:rgba(155,112,207,.08)}
.tb-biz{color:var(--orange);border:1px solid rgba(229,144,58,.3);background:rgba(229,144,58,.08)}
.tb-sub{color:var(--green);border:1px solid rgba(46,204,138,.3);background:rgba(46,204,138,.08)}
/* video cards - netflix style */

.pb{width:40px;height:40px;border-radius:50%;background:rgba(201,169,76,.9);color:var(--ink);

.vi{padding:8px 10px}
.vttl{font-size:11px;font-weight:600;color:var(--cream);line-height:1.35;

.vmod{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}

.vemb{position:absolute;inset:0;background:#000}
.vemb iframe{width:100%;height:100%;border:none}
/* modal sheet */
.ovl{position:fixed;inset:0;z-index:150;background:rgba(8,12,24,.87);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ink2);border:1px solid var(--border2);border-radius:20px 20px 0 0;

.qi{display:flex;align-items:flex-start;gap:13px;padding:14px 15px;

.tb-bb3{color:#E5903A;border:1px solid rgba(229,144,58,.3);background:rgba(229,144,58,.08)}
.tb-bb4{color:#E85454;border:1px solid rgba(232,84,84,.3);background:rgba(232,84,84,.08)}
.tb-bb5{color:#9B70CF;border:1px solid rgba(155,112,207,.3);background:rgba(155,112,207,.08)}
.tcn{font-family:var(--fh);font-size:16px;font-weight:700}
.tcr{font-size:10px;color:var(--muted);margin-bottom:7px;font-style:italic}
.tcrw{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-top:1px solid rgba(245,239,224,.06)}
.tcd{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* onboarding */
.ck{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:7px;cursor:pointer;transition:all .2s}
.ck.done{background:rgba(46,204,138,.06);border-color:rgba(46,204,138,.25)}
.ckc{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s;margin-top:1px}
.ck.done .ckc{background:var(--green);border-color:var(--green);color:#fff}
.ckl{font-size:13px;font-weight:600;color:var(--cream);margin-bottom:2px}
.cks{font-size:11px;color:var(--muted);line-height:1.5}
.ck.done .ckl{color:var(--muted);text-decoration:line-through}
/* schedule slots */
.slot{background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:7px;display:flex;align-items:center;gap:11px}
.sloto{border-style:dashed;cursor:pointer}.sloto:hover,.sloto:active{border-color:var(--gold);background:rgba(201,169,76,.05)}
/* campaigns */
.cc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px}
.cctl{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--cream);margin-bottom:4px}
.ccen{font-size:11px;color:var(--green);font-weight:700;padding:6px 11px;border-radius:var(--rs);background:rgba(46,204,138,.1);border:1px solid rgba(46,204,138,.2);display:inline-block}
/* battles */
.bc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px;position:relative;overflow:hidden}
.bc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--orange),var(--gold))}
/* check-in */
.cinq{background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:9px}
.cinq label{font-size:12px;font-weight:600;color:var(--gold);display:block;margin-bottom:7px}
.cinq textarea{height:60px;margin-bottom:0}
.stars{display:flex;gap:7px}
.star{font-size:22px;cursor:pointer;opacity:.3;transition:opacity .2s;border:none;background:none;padding:3px}
.star.on{opacity:1}
/* scouting */
.scc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px}
.scttl{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:7px}
.scbody{font-size:12px;color:var(--cream);line-height:1.95;white-space:pre-wrap}
/* deals */
.dc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:11px}
/* mod */
.ibox{background:rgba(201,169,76,.08);border:1px solid var(--border2);border-radius:var(--rs);padding:13px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.1em}
.cpb{font-size:10px;color:var(--muted);cursor:pointer;padding:5px 9px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;transition:all .2s;text-transform:uppercase}
.cpb:hover{color:var(--gold)}
.tbs{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tbn{padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s;text-transform:uppercase}
.tbn.on{color:var(--gold);border-color:var(--border2);background:rgba(201,169,76,.12)}
.epick{font-size:21px;cursor:pointer;padding:5px;border-radius:var(--rs);border:2px solid transparent;transition:all .2s}
.epick.on{border-color:var(--gold);background:rgba(201,169,76,.1)}
/* auth */
.aw{max-width:300px;margin:0 auto;text-align:center;padding:22px 14px}
.alogo{width:74px;height:74px;border-radius:50%;object-fit:contain;background:var(--ink2);border:3px solid var(--gold);margin-bottom:16px;box-shadow:0 0 28px rgba(201,169,76,.3)}
.atl{font-family:var(--fh);font-size:24px;color:var(--gold);margin-bottom:7px}
.asu{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.65}
.aerr{font-size:12px;color:var(--red);margin-top:7px;min-height:17px}
/* about */
.abs{margin-bottom:18px}
.abs h3{font-family:var(--fh);font-size:19px;color:var(--gold);margin-bottom:9px;font-style:italic}
.abs p{font-size:13px;color:var(--muted2);line-height:1.8}
.abs ul{list-style:none;padding:0}
.abs ul li{font-size:13px;color:var(--muted2);line-height:1.8;padding-left:15px;position:relative}
.abs ul li::before{content:'✦';position:absolute;left:0;color:var(--gold);font-size:9px}
.joinc{background:linear-gradient(135deg,rgba(201,169,76,.12),rgba(14,22,40,.95));border:1px solid var(--border2);border-radius:20px;padding:22px;text-align:center;margin-bottom:18px}
.joinc h3{font-family:var(--fh);font-size:21px;color:var(--gold);margin-bottom:9px}
.joinc p{font-size:13px;color:var(--muted2);line-height:1.7;margin-bottom:16px}
/* misc */
.nbanner{background:linear-gradient(135deg,rgba(201,169,76,.1),rgba(14,22,40,.9));border:1px solid var(--border2);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:11px}
.nn{display:flex;align-items:center;gap:9px;padding:9px 13px;background:rgba(201,169,76,.07);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:13px}
.nn span{font-size:12px;color:var(--muted)}
.nn strong{color:var(--gold)}
.ticker-wrap{overflow:hidden;background:rgba(201,169,76,.07);border-top:1px solid rgba(201,169,76,.15);border-bottom:1px solid rgba(201,169,76,.15);padding:8px 0;margin:0 -15px;position:relative;z-index:1;}
.ticker-track{display:flex;gap:60px;white-space:nowrap;animation:ticker 30s linear infinite;}
.ticker-track:hover{animation-play-state:paused;}
.ticker-item{font-size:12px;color:var(--gold2);font-style:italic;flex-shrink:0;}
.ticker-item::before{content:'✦';margin-right:10px;color:var(--gold);font-style:normal;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.cow-card{background:linear-gradient(135deg,rgba(201,169,76,.12),rgba(14,22,40,.95));border:1px solid var(--border2);border-radius:var(--r);padding:16px;margin-bottom:13px;position:relative;overflow:hidden;}
.cow-card::before{content:'👑';position:absolute;right:14px;top:14px;font-size:28px;opacity:.3;}
.lb-row{display:flex;align-items:center;gap:11px;padding:11px 14px;background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:7px;}
.lb-rank{font-family:var(--fh);font-size:22px;font-weight:700;min-width:32px;text-align:center;}
.bat-result{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px;}
.res-winner{font-family:var(--fh);font-size:16px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.empty{text-align:center;padding:28px 13px;color:var(--muted);font-size:13px}
.eic{font-size:28px;margin-bottom:9px;opacity:.5}
/* toast */
.toast{position:fixed;bottom:calc(68px + var(--sb) + 9px);left:50%;
  transform:translateX(-50%) translateY(80px);
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);
  padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:300;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;
  pointer-events:none;box-shadow:0 4px 22px rgba(201,169,76,.35)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:linear-gradient(135deg,#E85454,#C03434);color:#fff}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

function ytId(url){
  if(!url)return'';
  try{
    if(url.indexOf('youtu.be/')>-1)return url.split('youtu.be/')[1].split(/[?&]/)[0].substring(0,11);
    if(url.indexOf('youtube.com/watch')>-1)return new URL(url).searchParams.get('v')||'';
    if(url.indexOf('youtube.com/embed/')>-1)return url.split('youtube.com/embed/')[1].split(/[?&]/)[0].substring(0,11);
  }catch(e){}return'';
}
function driveId(url){
  if(!url)return'';
  try{
    // https://drive.google.com/file/d/FILE_ID/view
    if(url.indexOf('drive.google.com/file/d/')>-1){
      var parts=url.split('/file/d/')[1];
      return parts.split('/')[0];
    }
    // https://drive.google.com/open?id=FILE_ID
    if(url.indexOf('drive.google.com/open')>-1){
      return new URL(url).searchParams.get('id')||'';
    }
  }catch(e){}return'';
}
function isDrive(url){return url&&url.indexOf('drive.google.com')>-1;}

function vidCard(v){

function groupByCat(vids){
  var g={};
  vids.forEach(function(v){var c=v.category||'General';if(!g[c])g[c]=[];g[c].push(v);});

function renderVids(vids){
  if(!vids.length)return'';
  var g=groupByCat(vids);
  var out='';
  Object.keys(g).forEach(function(cat){
    out+='<div class="vcat"><span>'+san(cat)+'</span></div><div class="nfrow">'+g[cat].map(vidCard).join('')+'</div>';

  return out;
}

async function submitQ(){
  var now=Date.now();
  if(now-_lq<10000){toast('Please wait before sending another question',true);return;}
  if(_qc>=5){toast('Question limit reached',true);return;}
  var name=document.getElementById('fn')?document.getElementById('fn').value.trim():'@anonymous';
  var text=document.getElementById('fq')?document.getElementById('fq').value.trim():'';
  if(!text){toast('Type your question first',true);return;}
  if(!selQid){toast('Select a creator first',true);return;}
  _lq=now;_qc++;
  try{
    await FS().addDoc(col('questions'),{creatorId:selQid,name:san(name),text:san(text),status:'pending',votes:0,createdAt:FS().serverTimestamp()});
    var el=document.getElementById('fq');if(el)el.value='';
    toast('Question sent! ✓');rLiveQ();
  }catch(e){toast('Connection error',true);}
}
async function upvote(id){
  var now=Date.now();if(_uv[id]&&now-_uv[id]<3000)return;_uv[id]=now;
  var q=questions[id];if(!q)return;
  var nv=!q.myVote;q.myVote=nv;rLiveQ();
  try{await FS().updateDoc(ref('questions',id),{votes:(q.votes||0)+(nv?1:-1)});}
  catch(e){q.myVote=!nv;rLiveQ();}
}
async function toggleLive(){

async function changeCode(){
  var key=document.getElementById('cc-key')?document.getElementById('cc-key').value:'';
  var newCode=document.getElementById('cc-new')?document.getElementById('cc-new').value.trim():'';
  if(!key){toast('Select a code to change',true);return;}
  if(!newCode||newCode.length<4){toast('New code must be at least 4 characters',true);return;}
  if(newCode.indexOf(' ')>-1){toast('Code cannot contain spaces',true);return;}
  try{
    await FS().setDoc(ref('codeOverrides',key),{code:newCode,updatedAt:FS().serverTimestamp()});
    window._codeOverrides=window._codeOverrides||{};
    window._codeOverrides[key]=newCode;
    var el=document.getElementById('cc-new');if(el)el.value='';
    var sel=document.getElementById('cc-key');if(sel)sel.value='';
    toast('Code updated! Old code no longer works. ✓');
    rMod();
  }catch(e){toast('Error updating code',true);}
}

  if(myResources.length){
    myResources.forEach(function(r){
      h+='<div class="card" style="padding:14px 15px;">';
      h+='<div style="display:flex;align-items:flex-start;gap:11px;">';
      h+='<div style="font-size:24px;">'+san(r.icon||'📄')+'</div>';

    h+='<div class="empty"><div class="eic">📁</div>No resources yet — your agency will add them here for you.</div>';

function rHubBB(body){
  var bbLevels=['bb1','bb2','bb3','bb4','bb5'];
  var h='<div class="nn"><span>💼</span><span>Business Builder is a <strong>paid program</strong>. Each level is unlocked with a separate code from the agency.</span></div>';
  h+='<div class="nbanner"><div style="font-size:26px;flex-shrink:0;">💼</div><div><div style="font-family:var(--fh);font-size:14px;color:var(--gold);margin-bottom:2px;">Business Builder — Full Course</div><div style="font-size:11px;color:var(--muted);line-height:1.5;">From getting your EIN all the way to scaling a successful business. 5 levels. Unlock each with your level code.</div></div></div>';
  h+='<div class="div"></div>';
  bbLevels.forEach(function(level){
    var i=tr(level);
    var isUnlocked=unlocked[level]===true;
    var vids=Object.values(hubVids).filter(function(v){return!v.deleted&&normTier(v.tier)===level;}).sort(function(a,b){return(parseInt(a.order)||999)-(parseInt(b.order)||999);});
    h+='<div class="tc '+i.cls+'"><div class="tcn" style="color:'+i.color+';">'+i.lbl+'</div><div class="tcr">'+i.req+'</div></div>';
    if(!isUnlocked){
      h+='<div class="lbox">';
      h+='<div class="lic">🔒</div>';
      h+='<div style="font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">'+i.lbl+'</div>';
      h+='<div class="lttl">Paid Content — Locked</div>';
      h+='<div class="lsub">This level is part of the Business Builder paid program. Contact the agency to purchase access and receive your unlock code.</div>';
      h+='<input type="password" id="bb-'+level+'" placeholder="Enter your level code" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')unlockBB(\''+level+'\')" />';
      h+='<button class="btn btng" onclick="unlockBB(\''+level+'\')" style="font-size:12px;padding:11px;">Unlock This Level</button>';
      h+='<p class="aerr" id="bberr-'+level+'"></p>';
      h+='</div>';
    }else{
      if(vids.length){
        var g={};vids.forEach(function(v){var c=v.category||'General';if(!g[c])g[c]=[];g[c].push(v);});
        Object.keys(g).forEach(function(cat){
          h+='<div class="vcat"><span>'+san(cat)+'</span></div><div class="nfrow">';
          g[cat].forEach(function(v){h+=vidCard(v);});
          h+='</div>';
        });
      }else{
        h+='<div class="lbox" style="background:rgba(245,239,224,.02);border-color:rgba(245,239,224,.08);padding:14px 18px;"><div style="font-size:11px;color:var(--muted);text-align:center;">Videos for this level coming soon.</div></div>';
      }
    }
    h+='<div class="div"></div>';
  });
  body.innerHTML=h;
}
function unlockBB(level){
  var input=document.getElementById('bb-'+level);
  var errEl=document.getElementById('bberr-'+level);
  if(!input)return;
  if(input.value===getCode(level)){
    unlocked[level]=true;
    sessionStorage.setItem('bc_u',JSON.stringify(unlocked));
    toast(tr(level).lbl+' unlocked! ✓');
    rHub();
  }else{
    if(errEl)errEl.textContent='Incorrect code. Contact the agency to purchase access.';
  }
}
