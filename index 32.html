.ck.done .ck-circ{background:var(--green);border-color:var(--green);color:#fff;}
.ck-lbl{font-size:13px;font-weight:600;color:var(--cream);margin-bottom:2px;}
.ck-sub{font-size:11px;color:var(--muted);line-height:1.5;}
.ck.done .ck-lbl{color:var(--muted);text-decoration:line-through;}
.slot{background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:7px;display:flex;align-items:center;gap:11px;}
.slot-open{border-style:dashed;cursor:pointer;}
.slot-open:hover{border-color:var(--gold);background:rgba(201,169,76,.05);}
.slot-day{font-weight:700;font-size:12px;min-width:76px;color:var(--gold);}
.cc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px;}
.cc-title{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--cream);margin-bottom:4px;}
.cc-enrolled{font-size:11px;color:var(--green);font-weight:700;padding:6px 11px;border-radius:var(--rs);background:rgba(46,204,138,.1);border:1px solid rgba(46,204,138,.2);display:inline-block;}
.bc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px;position:relative;overflow:hidden;}
.bc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--orange),var(--gold));}
.bc-title{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--cream);margin-bottom:3px;}
.bc-vs{font-size:11px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.cin-q{background:rgba(245,239,224,.04);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:9px;}
.cin-q label{font-size:12px;font-weight:600;color:var(--gold);display:block;margin-bottom:7px;}
.cin-q textarea{height:60px;margin-bottom:0;}
.stars{display:flex;gap:7px;}
.star{font-size:23px;cursor:pointer;opacity:.3;transition:all .2s;border:none;background:none;padding:3px;}
.star.on{opacity:1;}
.sc-card{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:9px;}
.sc-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:7px;}
.sc-body{font-size:12px;color:var(--cream);line-height:1.95;white-space:pre-wrap;}
.sc-note{font-size:11px;color:var(--muted);margin-top:7px;font-style:italic;border-top:1px solid var(--border);padding-top:7px;}
.dc{background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:11px;}
.dc-brand{font-family:var(--fh);font-size:17px;font-weight:700;color:var(--cream);margin-bottom:5px;}
.dc-applied{font-size:11px;color:var(--green);font-weight:700;padding:6px 12px;border-radius:var(--rs);background:rgba(46,204,138,.1);border:1px solid rgba(46,204,138,.2);display:inline-block;}
.inv-box{background:rgba(201,169,76,.08);border:1px solid var(--border2);border-radius:var(--rs);padding:13px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.1em;}
.cpbtn{font-size:10px;color:var(--muted);cursor:pointer;padding:5px 9px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;transition:all .2s;text-transform:uppercase;}
.cpbtn:hover{color:var(--gold);}
.tbns{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.tbn{padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s;text-transform:uppercase;}
.tbn.on{color:var(--gold);border-color:var(--border2);background:rgba(201,169,76,.12);}
.epick{font-size:21px;cursor:pointer;padding:5px;border-radius:var(--rs);border:2px solid transparent;transition:all .2s;}
.epick:hover{background:rgba(245,239,224,.06);}
.epick.on{border-color:var(--gold);background:rgba(201,169,76,.1);}
.aw{max-width:310px;margin:0 auto;text-align:center;padding:22px 14px;}
.alogo{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);margin-bottom:16px;box-shadow:0 0 32px rgba(201,169,76,.35);}
.atitle{font-family:var(--fh);font-size:24px;color:var(--gold);margin-bottom:7px;}
.asub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.65;}
.aerr{font-size:12px;color:var(--red);margin-top:7px;min-height:17px;}
.ab-sec{margin-bottom:18px;}
.ab-sec h3{font-family:var(--fh);font-size:19px;color:var(--gold);margin-bottom:9px;font-style:italic;}
.ab-sec p{font-size:13px;color:var(--muted2);line-height:1.8;}
.ab-sec ul{list-style:none;padding:0;}
.ab-sec ul li{font-size:13px;color:var(--muted2);line-height:1.8;padding-left:15px;position:relative;}
.ab-sec ul li::before{content:'✦';position:absolute;left:0;color:var(--gold);font-size:9px;}
.join-c{background:linear-gradient(135deg,rgba(201,169,76,.12),rgba(14,22,40,.95));border:1px solid var(--border2);border-radius:var(--rx);padding:22px;text-align:center;margin-bottom:18px;}
.join-c h3{font-family:var(--fh);font-size:21px;color:var(--gold);margin-bottom:9px;}
.join-c p{font-size:13px;color:var(--muted2);line-height:1.7;margin-bottom:16px;}
.nbanner{background:linear-gradient(135deg,rgba(201,169,76,.1),rgba(14,22,40,.9));border:1px solid var(--border2);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:11px;}
.nbanner .ni{font-size:26px;flex-shrink:0;}
.nbanner .nt{font-family:var(--fh);font-size:14px;color:var(--gold);margin-bottom:2px;}
.nbanner .ns{font-size:11px;color:var(--muted);line-height:1.5;}
.nn{display:flex;align-items:center;gap:9px;padding:9px 13px;background:rgba(201,169,76,.07);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:13px;}
.nn span{font-size:12px;color:var(--muted);}
.nn strong{color:var(--gold);}
.empty{text-align:center;padding:28px 13px;color:var(--muted);font-size:13px;}
.empty-ic{font-size:28px;margin-bottom:9px;opacity:.5;}
.toast{position:fixed;bottom:calc(68px + var(--safe-b) + 9px);left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:300;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;box-shadow:0 4px 22px rgba(201,169,76,.35);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{background:linear-gradient(135deg,#E85454,#C03434);color:#fff;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

function renderHubVideos(body,myNiche,myTier){
  const allVids=Object.values(hubVideos).filter(v=>!v.deleted);
  // Show: creator's own niche + general (null/all). Never show other niches.
  // Map old tier names to new ones so existing videos still show
  const tierMap={'academy':'seedling','multiplatform':'grower','business':'business','subagency':'subagency','free':'seedling'};
  const normTier=(t)=>tierMap[t]||t;
  const getVids=(tier,nicheFilter)=>allVids.filter(v=>{const vt=normTier(v.tier);
    if(vt!==tier)return false;
    if(nicheFilter==='all')return v.niche===null||v.niche==='all'||!v.niche;
    return v.niche===nicheFilter;
  }).sort((a,b)=>{const oa=parseInt(a.order)||999,ob=parseInt(b.order)||999;return oa!==ob?oa-ob:(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0);});
  const gCat=(vids)=>{const g={};vids.forEach(v=>{const c=v.category||'General';if(!g[c])g[c]=[];g[c].push(v);});return g;};
  const vidCard=(v)=>{const id=ytId(v.url);const thumb=id?`https://img.youtube.com/vi/${id}/mqdefault.jpg`:'';return`<div class="vc" onclick="playVid('${id||''}','${san(v.title).replace(/'/g,"&#39;")}','${san(v.url)}')"><div class="vt"><div class="vti" style="${thumb?`background-image:url('${thumb}')`:''};background-color:rgba(245,239,224,.04);"><div class="pb">▶</div></div></div><div class="vi"><div class="vttl">${san(v.title)}</div><div class="vdsc">${san(v.description||'Tap to watch')}</div></div></div>`;};
  const renderSec=(vids)=>{if(!vids.length)return'';const g=gCat(vids);return Object.entries(g).map(([cat,cvids])=>`<div class="vcat"><span>${san(cat)}</span></div><div class="nf-row">${cvids.map(vidCard).join('')}</div>`).join('');};
  const lockBox=(tier)=>{const i=tr(tier);return`<div class="lbox"><div class="lic">🔒</div><div style="font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">${i.lbl}</div><div class="lttl">Section locked</div><div class="lsub">${i.req}<br/><br/>Enter your access code or contact your agency to upgrade.</div><input type="password" id="tu-${tier}" placeholder="Enter tier code" autocomplete="new-password" onkeydown="if(event.key==='Enter')unlockTier('${tier}')"/><button class="btn btn-g" onclick="unlockTier('${tier}')" style="font-size:12px;padding:11px;">Unlock</button><p class="aerr" id="tuerr-${tier}"></p></div>`;};
  let html=`<div class="nn"><span>🔒</span><span>You need <strong>two codes</strong>: your tier code + your <strong>${nicheName(myNiche)} niche code</strong>. Each niche is completely separate.</span></div>`;
  html+=`<div class="nbanner"><div class="ni">🏆</div><div><div class="nt">Live Incentive Plan — Season 1</div><div class="ns">Each tier below matches your weekly performance rewards.</div></div></div><div class="div"></div>`;
  TO.forEach(tier=>{const i=tr(tier);
    // Tier-level lock — enter tier code first
    const tierUnlocked=unlockedTiers[tier]===true;
    html+=`<div class="tc ${i.cls}"><div class="tc-n" style="color:${i.color};">${i.lbl}</div><div class="tc-r">${i.req}</div></div>`;
    if(!tierUnlocked){
      html+=lockBox(tier);
    } else {
      // ── GENERAL videos: visible to all inside this tier ──
      const generalVids=getVids(tier,'all');
      if(generalVids.length){
        html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">🌐 General — All Niches</span></div>`;
        html+=renderSec(generalVids);
      }
      // ── NICHE section: ONLY this creator's niche, locked with its own code ──
      const nicheKey='niche-'+myNiche;
      const nicheUnlocked=unlockedTiers[nicheKey]===true;
      // Only show niche section if there are niche videos for this tier
      const myNicheVids=getVids(tier,myNiche);
      // Always show the niche lock — even if empty, so creators know it exists
      html+=`<div style="height:12px;"></div>`;
      html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;">
        <span style="font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;">${nicheName(myNiche)} Creators Only</span>
        ${nicheUnlocked?'<span style="font-size:9px;color:var(--green);font-weight:700;">✓ UNLOCKED</span>':'<span style="font-size:9px;color:var(--muted);">🔒 LOCKED</span>'}
      </div>`;
      if(nicheUnlocked){
        if(myNicheVids.length){
          html+=renderSec(myNicheVids);
        } else {
          html+=`<div class="lbox" style="background:rgba(245,239,224,.02);border:1px solid rgba(245,239,224,.08);padding:14px 18px;">
            <div style="font-size:11px;color:var(--muted);text-align:center;">No ${nicheName(myNiche)} videos added to this tier yet.</div>
          </div>`;
        }
      } else {
        html+=`<div class="lbox">
          <div class="lic">${myNiche==='pets'?'🐾':myNiche==='beauty'?'✨':'🌿'}</div>
          <div style="font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">${nicheName(myNiche)} Creators Only</div>
          <div class="lttl">Your Niche Is Locked</div>

          <input type="password" id="nl-${nicheKey}" placeholder="Enter your ${nicheName(myNiche)} code" autocomplete="new-password" onkeydown="if(event.key==='Enter')unlockNiche('${myNiche}')"/>
          <button class="btn btn-g" onclick="unlockNiche('${myNiche}')" style="font-size:12px;padding:11px;">Unlock ${nicheName(myNiche)} Content</button>
          <p class="aerr" id="nlerr-${nicheKey}"></p>
        </div>`;
      }
    }
    html+=`<div class="div"></div>`;});
  body.innerHTML=html;
}
function unlockNiche(niche){
  // Each niche has its OWN code — separate from tier codes
  // Pets: BloomPets2024, Beauty: BloomBea2024, Lifestyle: BloomLif2024
  const key='niche-'+niche;
  const input=document.getElementById('nl-'+key);
  const errEl=document.getElementById('nlerr-'+key);
  if(!input)return;
  const correctCode=window.__BCPW[niche];
  if(input.value===correctCode){
    unlockedTiers[key]=true;
    sessionStorage.setItem('bc_tiers',JSON.stringify(unlockedTiers));

    renderHub();
  } else {
    if(errEl)errEl.textContent='Incorrect code. Contact your agency.';
  }
}

  s.innerHTML=`<div class="wrap"><div style="text-align:center;margin-bottom:18px;"><p style="font-family:var(--fh);font-size:26px;color:var(--gold);">Brand Deals</p><p style="font-size:12px;color:var(--muted);margin-top:4px;">Curated by Bloom &amp; Co</p></div>${allD.length?allD.map(d=>`<div class="dc"><div class="dc-brand">${san(d.brand)}</div><div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:11px;">${san(d.description)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px;">${(d.niches||[]).map(n=>`<span style="font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--gold);background:rgba(201,169,76,.08);">${niche(n)}</span>`).join('')}${d.type?`<span style="font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--gold);background:rgba(201,169,76,.08);">${san(d.type)}</span>`:''}</div>${d.pay?`<div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:11px;">💰 ${san(d.pay)}</div>`:''} ${appliedDeals.includes(d.id)?'<span class="dc-applied">✓ Applied — agency will be in touch</span>':`<button class="btn btn-g" onclick="applyDeal('${d.id}','${san(d.brand).replace(/'/g,"&#39;")}')">Apply Now</button>`}</div>`).join(''):`<div class="empty"><div class="empty-ic">💼</div>No deals posted yet</div>`}</div>`;

function unlockDeals(){const pw=document.getElementById('dpw')?.value;if(pw===window.__BCPW.deals){dealsUnlocked=true;renderDeals();}else{document.getElementById('derr').textContent='Incorrect code.';}}
async function applyDeal(id,brand){if(!currentCreator){toast('Log in as a creator first',true);return;}try{await FS().addDoc(col('dealApplications'),{dealId:id,brand:san(brand),creatorId:currentCreator.id,creatorName:currentCreator.name,niche:currentCreator.niche,appliedAt:FS().serverTimestamp()});appliedDeals.push(id);localStorage.setItem('bc_applied',JSON.stringify(appliedDeals));toast('Applied! ✓');renderDeals();}catch(e){toast('Error',true);}}
function renderAbout(){

function showModEntry(){const ex=document.getElementById('mod-entry-pop');if(ex){ex.remove();return;}const div=document.createElement('div');div.id='mod-entry-pop';div.style.cssText='position:fixed;bottom:calc(68px + var(--safe-b) + 9px);left:50%;transform:translateX(-50%);background:rgba(14,22,40,.97);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;z-index:50;min-width:250px;backdrop-filter:blur(20px);';div.innerHTML=`<input type="password" id="mpw" placeholder="Agency password" autocomplete="new-password" style="margin-bottom:7px;" onkeydown="if(event.key==='Enter')unlockModEntry()"/><button class="btn btn-g" onclick="unlockModEntry()" style="font-size:12px;padding:10px;">Enter</button><p class="aerr" id="mperr"></p>`;document.body.appendChild(div);setTimeout(()=>document.getElementById('mpw')?.focus(),100);}
function unlockModEntry(){const pw=document.getElementById('mpw')?.value;if(pw===window.__BCPW.mod){modLoggedIn=true;const div=document.getElementById('mod-entry-pop');if(div)div.remove();let mt=document.getElementById('t-mod');if(!mt){const nav=document.querySelector('.tabs');const btn=document.createElement('button');btn.className='tab';btn.id='t-mod';btn.innerHTML='<span class="tab-ic">🔐</span><span>Mod</span>';btn.onclick=()=>go('mod');nav.appendChild(btn);}go('mod');}else{const err=document.getElementById('mperr');if(err)err.textContent='Incorrect password.';}}

function renderScoutScripts(){
  const scripts=[{title:'Cold DM — Pets Creator',note:'Use for TikTok pet creators with 500–5,000 followers',body:`Hey [Name]! 👋 I came across your page and your content is exactly what we look for at Bloom & Co.\n\nWe're a boutique creator network that helps pet creators grow on TikTok Live — through coaching, live strategy, brand deal connections, and a cash incentive program for top performers.\n\nWe're selective about who we bring on, and I think you'd be a great fit.\n\nWould love to share more if you're open to it — no pressure at all. 🌸`},{title:'Cold DM — Beauty Creator',note:'Use for beauty/makeup TikTok creators',body:`Hey [Name]! ✨ Your page caught my eye — the way you present your content is genuinely impressive.\n\nI'm reaching out from Bloom & Co, a private creator network for beauty creators serious about growing on TikTok Live.\n\nWe offer coaching, strategy sheets, live support, and a cash incentive program for creators who hit their weekly goals.\n\nIf that sounds interesting I'd love to tell you more. No pressure at all 🌸`},{title:'Follow-Up DM',note:'Send 3–5 days after no response',body:`Hey [Name]! Just following up on my message — I know DMs get busy.\n\nIf you're ever curious about what we do at Bloom & Co, I'm happy to answer any questions. We're always looking for creators who are ready to take their content seriously.\n\nEither way — keep up the great work! 🌿`},{title:'Discovery Call Script',note:'Use when a creator agrees to a call or asks for more info',body:`Thanks for hopping on — I'll keep this short!\n\nBloom & Co is a boutique creator network. We work with a small number of creators across pets, beauty, and lifestyle niches on TikTok Live.\n\nWhat we offer:\n→ Live coaching and personalised strategy sheets\n→ A private creator hub with training videos and tools\n→ Weekly performance tracking and feedback\n→ A cash incentive program — creators who hit their goals earn real bonuses\n→ Brand deal connections as you grow\n\nWe're not looking for volume — we want creators who are committed and ready to grow.\n\nWhat does your current live schedule look like? [Listen and respond]\n\nI think you'd fit really well. Want me to send over the invite details?`},{title:'Rejection / Not Ready Response',note:'When a creator says no or not right now',body:`Totally understand — no pressure at all! 🌸\n\nIf things change or you decide you want to level up your live game, feel free to reach back out. We'd love to have you when the timing is right.\n\nWishing you all the best with your content! 🌿`}];
  return scripts.map(sc=>`<div class="sc-card"><div class="sc-title">${sc.title}</div><div class="sc-note">${sc.note}</div><div class="sc-body">${sc.body}</div><button class="cpbtn" onclick="copy(document.querySelector('#sc-body-${scripts.indexOf(sc)}').innerText)" style="margin-top:9px;" id="cpbtn-${scripts.indexOf(sc)}">Copy Script</button><pre id="sc-body-${scripts.indexOf(sc)}" style="display:none">${sc.body}</pre></div>`).join('');
}
function unlockScout(){const pw=document.getElementById('scout-pw')?.value;if(pw===window.__BCPW.scout){scoutUnlocked=true;toast('Scouting scripts unlocked ✓');renderMod();}else{const e=document.getElementById('scout-err');if(e)e.textContent='Incorrect password.';}}
function modLogout(){modLoggedIn=false;scoutUnlocked=false;const t=document.getElementById('t-mod');if(t)t.remove();go('about');}
async function modQ(id,status){try{await FS().updateDoc(ref('questions',id),{status});toast(status==='approved'?'Approved ✓':'Removed');}catch(e){toast('Error',true);}}
async function setTier(cid,tier){try{await FS().updateDoc(ref('creators',cid),{tier,tierUpdatedAt:FS().serverTimestamp()});if(creators[cid])creators[cid].tier=tier;if(currentCreator?.id===cid)currentCreator.tier=tier;toast(`Updated to ${tr(tier).lbl} ✓`);renderMod();}catch(e){toast('Error',true);}}
async function delCreator(id,name){if(!confirm(`Remove ${name}?`))return;try{await FS().updateDoc(ref('creators',id),{deleted:true,deletedAt:FS().serverTimestamp()});delete creators[id];toast(`${name} removed.`);renderMod();}catch(e){toast('Error',true);}}
async function moveVideo(id,tier){try{await FS().updateDoc(ref('hubVideos',id),{tier});if(hubVideos[id])hubVideos[id].tier=tier;toast(`Moved to ${tr(tier).lbl} ✓`);renderMod();}catch(e){toast('Error',true);}}
async function delVideo(id,title){if(!confirm(`Delete "${title}"?`))return;try{await FS().updateDoc(ref('hubVideos',id),{deleted:true});delete hubVideos[id];toast('Video removed ✓');renderMod();}catch(e){toast('Error',true);}}
async function genInvite(){const n=document.getElementById('inv-niche')?.value;const code=genCode(n);try{await FS().setDoc(ref('invites',code),{niche:n,used:false,createdAt:FS().serverTimestamp()});document.getElementById('inv-result').innerHTML=`<div class="inv-box"><span>${code}</span><button class="cpbtn" onclick="copy('${code}')">Copy</button></div><p style="font-size:10px;color:var(--muted);">One-time use · ${n}</p>`;toast('Code generated ✓');}catch(e){toast('Error',true);}}
async function postAnn(){const text=document.getElementById('ann-txt')?.value.trim();if(!text){toast('Write something first',true);return;}try{await FS().addDoc(col('announcements'),{text:san(text),createdAt:FS().serverTimestamp()});document.getElementById('ann-txt').value='';toast('Announcement posted ✓');}catch(e){toast('Error',true);}}
async function addVideo(){if(_addingVid){toast('Already adding',true);return;}const title=document.getElementById('vt')?.value.trim();const url=document.getElementById('vu')?.value.trim();if(!title||!url){toast('Add title and link',true);return;}const cat=document.getElementById('vcat')?.value.trim()||'General';const order=parseInt(document.getElementById('vord')?.value)||999;const tier=document.getElementById('vtier')?.value;const vn=document.getElementById('vniche')?.value;const btn=document.getElementById('add-vid-btn');if(btn){btn.textContent='Adding…';btn.disabled=true;}_addingVid=true;try{await FS().addDoc(col('hubVideos'),{title:san(title),url:san(url),description:san(document.getElementById('vd')?.value.trim()||''),category:san(cat),tier,niche:vn==='all'?null:vn,order,createdAt:FS().serverTimestamp()});['vt','vu','vd','vcat','vord'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});toast('Video added ✓');}catch(e){toast('Error adding video',true);}finally{_addingVid=false;if(btn){btn.textContent='Add Video';btn.disabled=false;}renderMod();}}
async function postCampaign(){const title=document.getElementById('cmp-t')?.value.trim();const desc=document.getElementById('cmp-d')?.value.trim();if(!title||!desc){toast('Add title and description',true);return;}try{await FS().addDoc(col('campaigns'),{title:san(title),description:san(desc),reward:san(document.getElementById('cmp-r')?.value.trim()||''),createdAt:FS().serverTimestamp()});['cmp-t','cmp-d','cmp-r'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});toast('Campaign posted ✓');renderMod();}catch(e){toast('Error',true);}}
async function delCampaign(id){try{await FS().updateDoc(ref('campaigns',id),{deleted:true});delete campaigns[id];toast('Campaign removed ✓');renderMod();}catch(e){toast('Error',true);}}
async function postBattle(){const title=document.getElementById('bat-t')?.value.trim();const desc=document.getElementById('bat-d')?.value.trim();if(!title||!desc){toast('Add title and description',true);return;}try{await FS().addDoc(col('battles'),{title:san(title),type:san(document.getElementById('bat-type')?.value.trim()||'Diamond Battle'),date:san(document.getElementById('bat-date')?.value.trim()||''),description:san(desc),prize:san(document.getElementById('bat-prize')?.value.trim()||''),createdAt:FS().serverTimestamp()});['bat-t','bat-type','bat-date','bat-d','bat-prize'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});toast('Battle posted ✓');renderMod();}catch(e){toast('Error',true);}}
async function delBattle(id){try{await FS().updateDoc(ref('battles',id),{deleted:true});delete battles[id];toast('Battle removed ✓');renderMod();}catch(e){toast('Error',true);}}
async function postDeal(){const brand=document.getElementById('db')?.value.trim();const desc=document.getElementById('dd')?.value.trim();if(!brand||!desc){toast('Add brand and description',true);return;}const ns=[];if(document.getElementById('d-pets')?.checked)ns.push('pets');if(document.getElementById('d-beauty')?.checked)ns.push('beauty');if(document.getElementById('d-lifestyle')?.checked)ns.push('lifestyle');try{await FS().addDoc(col('brandDeals'),{brand:san(brand),description:san(desc),pay:san(document.getElementById('dp')?.value.trim()||''),type:san(document.getElementById('dty')?.value.trim()||''),niches:ns,createdAt:FS().serverTimestamp()});['db','dd','dp','dty'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});toast('Deal posted ✓');}catch(e){toast('Error',true);}}
function startSubs(){
  FS().onSnapshot(col('creators'),snap=>{creators={};snap.docs.forEach(d=>creators[d.id]={id:d.id,...d.data()});const lc=Object.values(creators).filter(c=>c.live&&!c.deleted).length;document.getElementById('lct').textContent=`${lc} Live`;if(currentCreator){const u=creators[currentCreator.id];if(u)Object.assign(currentCreator,u);}if(document.getElementById('s-audience').classList.contains('active'))renderAudience();if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('questions'),snap=>{snap.docs.forEach(d=>{const ex=questions[d.id];questions[d.id]={id:d.id,...d.data(),myVote:ex?.myVote||false};});Object.keys(questions).forEach(id=>{if(!snap.docs.find(d=>d.id===id))delete questions[id];});if(document.getElementById('s-liveq').classList.contains('active'))renderLiveQ();if(document.getElementById('s-stats').classList.contains('active'))renderStats();if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('schedules'),snap=>{schedules={};snap.docs.forEach(d=>schedules[d.id]={id:d.id,...d.data()});if(document.getElementById('s-hub').classList.contains('active'))renderHub();if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('brandDeals'),snap=>{deals={};snap.docs.forEach(d=>deals[d.id]={id:d.id,...d.data()});if(document.getElementById('s-deals').classList.contains('active'))renderDeals();});
  FS().onSnapshot(col('announcements'),snap=>{announcements={};snap.docs.forEach(d=>announcements[d.id]={id:d.id,...d.data()});if(document.getElementById('s-audience').classList.contains('active'))renderAudience();});
  FS().onSnapshot(col('hubVideos'),snap=>{hubVideos={};snap.docs.forEach(d=>hubVideos[d.id]={id:d.id,...d.data()});if(document.getElementById('s-hub').classList.contains('active'))renderHub();if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('campaigns'),snap=>{campaigns={};snap.docs.forEach(d=>{const dd=d.data();if(!dd.deleted)campaigns[d.id]={id:d.id,...dd};});if(document.getElementById('s-hub').classList.contains('active'))renderHub();if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('battles'),snap=>{battles={};snap.docs.forEach(d=>{const dd=d.data();if(!dd.deleted)battles[d.id]={id:d.id,...dd};});if(document.getElementById('s-hub').classList.contains('active'))renderHub();if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('checkins'),snap=>{checkins={};snap.docs.forEach(d=>checkins[d.id]={id:d.id,...d.data()});if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
  FS().onSnapshot(col('dealApplications'),snap=>{window._dealApps={};snap.docs.forEach(d=>window._dealApps[d.id]={id:d.id,...d.data()});if(modLoggedIn&&document.getElementById('s-mod').classList.contains('active'))renderMod();});
}
async function tryAutoLogin(){const saved=localStorage.getItem('bc_cc');if(!saved)return;try{const snap=await FS().getDocs(FS().query(col('creators'),FS().where('code','==',saved)));if(!snap.empty){const d=snap.docs[0];currentCreator={id:d.id,...d.data()};subCQ();}}catch(e){}}

whenReady(()=>{startSubs();tryAutoLogin().then(()=>renderAudience());});
</script>
<script>
if('serviceWorker' in navigator){
  const swCode = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => self.clients.claim());
self.addEventListener('fetch', e => {
  if(e.request.url.includes('firestore')||e.request.url.includes('firebase')||e.request.url.includes('googleapis')||e.request.url.includes('gstatic'))return;
  e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
});`;
  const blob = new Blob([swCode], {type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
